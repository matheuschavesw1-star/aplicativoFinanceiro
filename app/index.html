<script>
(() => {
'use strict';

/* ═════════════ Utilidades ═════════════ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
/* Categoria principal > subcategoria (padrão) */
const CATS_PADRAO = () => ([
  { nome:'Moradia', subs:['Aluguel','Energia (Luz)','Internet','Celular','Gás','Água','Manutenção / Pintura'] },
  { nome:'Empresa / Profissional', subs:['Contabilidade','Impostos / DAS','Ferramentas / Software'] },
  { nome:'Pensão / Família', subs:['Pensão','Dependentes'] },
  { nome:'Transporte', subs:['Combustível','Aplicativos','Manutenção','Passagem de ônibus'] },
  { nome:'Alimentação', subs:[] },
  { nome:'Saúde', subs:['Plano de saúde','Benefício'] },
  { nome:'Cartão de Crédito', subs:[] },
  { nome:'Outros', subs:[] }
]);
const emptySeed = () => ({
  version: 5,
  params: { aliquota: 0.06, lag: 1, limAtencao: 0.7, limCritico: 0.9, impostoCat: 'Empresa / Profissional', impostoSub: 'Impostos / DAS' },
  categorias: CATS_PADRAO(),
  receitas: [], despesas: [], ajustes: [], pagos: {}
});
const SEED = () => { const s = (typeof window.__SEED === 'function' ? window.__SEED() : emptySeed()); migrar(s); return s; };
const valid = s => s && typeof s==='object' && s.params && Array.isArray(s.categorias) && Array.isArray(s.receitas) && Array.isArray(s.despesas) && Array.isArray(s.ajustes);

/* Migração: dados antigos (categorias em texto) -> categoria principal + subcategoria. Retorna true se alterou. */
const normTxt = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const MAPA_DESC = {   // descrição (sem acento/maiúscula) -> [categoria, subcategoria]
  'aluguel':['Moradia','Aluguel'], 'luz':['Moradia','Energia (Luz)'], 'energia':['Moradia','Energia (Luz)'], 'energia (luz)':['Moradia','Energia (Luz)'],
  'internet':['Moradia','Internet'], 'gas':['Moradia','Gás'], 'agua':['Moradia','Água'],
  'pintura':['Moradia','Manutenção / Pintura'],
  'contabilidade':['Empresa / Profissional','Contabilidade'], 'pensao':['Pensão / Família','Pensão'],
  'celular':['Moradia','Celular'],
  'passagem':['Transporte','Passagem de ônibus']
};
const MAPA_CAT = {    // categoria antiga -> categoria nova
  'moradia':'Moradia', 'contas de consumo':'Moradia', 'pensao / familia':'Pensão / Família', 'terreno / imovel':'Outros',
  'transporte':'Transporte', 'alimentacao':'Alimentação', 'saude':'Saúde', 'cartao de credito':'Cartão de Crédito',
  'impostos':'Empresa / Profissional', 'educacao':'Outros', 'lazer':'Outros', 'outros':'Outros', 'familia':'Pensão / Família', 'imovel':'Outros'
};
function migrar(s){
  let mudou = false;
  s.params = s.params || {};
  if(!Array.isArray(s.categorias) || (s.categorias.length && typeof s.categorias[0]==='string')){
    const antigas = (s.categorias||[]).filter(c=>typeof c==='string');
    const novas = CATS_PADRAO();
    for(const d of s.despesas){
      const dn = normTxt(d.descricao), map = MAPA_DESC[dn];
      if(map){ d.categoria = map[0]; d.sub = map[1]; continue; }
      const alvo = MAPA_CAT[normTxt(d.categoria)];
      if(alvo){ d.categoria = alvo; }
      else { d.categoria = d.categoria || 'Outros'; if(!novas.some(c=>c.nome===d.categoria)) novas.push({ nome:d.categoria, subs:[] }); }
      d.sub = d.sub || '';
    }
    for(const c of antigas){   // categorias personalizadas que o usuário criou e não têm correspondente
      if(!MAPA_CAT[normTxt(c)] && !novas.some(n=>n.nome===c)) novas.push({ nome:c, subs:[] });
    }
    s.categorias = novas; mudou = true;
  }
  if(s.params.categoriaImposto!==undefined || !s.params.impostoCat){
    delete s.params.categoriaImposto;
    s.params.impostoCat = s.params.impostoCat || 'Empresa / Profissional';
    s.params.impostoSub = s.params.impostoSub || 'Impostos / DAS';
    mudou = true;
  }
  for(const d of s.despesas) if(d.sub===undefined){ d.sub = ''; mudou = true; }
  if((s.version||0) < 3){
    // v3: novas subcategorias (Passagem de ônibus; Plano de saúde / Benefício) e reclassificação só dos itens ainda sem subcategoria
    const garante = (cat, sub) => { const c = s.categorias.find(x=>x.nome===cat); if(c && !c.subs.includes(sub)) c.subs.push(sub); };
    garante('Transporte','Passagem de ônibus'); garante('Saúde','Plano de saúde'); garante('Saúde','Benefício');
    for(const d of s.despesas){
      const dn = normTxt(d.descricao);
      if(dn==='passagem' && d.categoria==='Transporte' && !d.sub) d.sub = 'Passagem de ônibus';
    }
    s.version = 3; mudou = true;
  }
  if((s.version||0) < 4){
    // v4: subcategoria Moradia › Celular; a despesa Celular sai de "Outros" (só se ainda estiver sem subcategoria)
    const m = s.categorias.find(x=>x.nome==='Moradia');
    if(m && !m.subs.includes('Celular')){ const i = m.subs.indexOf('Internet'); m.subs.splice(i>=0 ? i+1 : m.subs.length, 0, 'Celular'); }
    for(const d of s.despesas){
      if(normTxt(d.descricao)==='celular' && d.categoria==='Outros' && !d.sub && m){ d.categoria = 'Moradia'; d.sub = 'Celular'; }
    }
    s.version = 4; mudou = true;
  }
  if((s.version||0) < 5){
    // v5: ajustes passam a ligar pelo ID da despesa (despesaId). Sem correspondência, o vínculo antigo pela descrição continua valendo (fallback).
    for(const a of s.ajustes){
      if(a.despesaId && s.despesas.some(d=>d.id===a.despesaId)) continue;
      const d = s.despesas.find(x=>x.descricao===a.despesa) || s.despesas.find(x=>normTxt(x.descricao)===normTxt(a.despesa));
      if(d) a.despesaId = d.id; else if(a.despesaId===undefined) a.despesaId = '';
    }
    s.version = 5; mudou = true;
  }
  if(!s.pagos || typeof s.pagos!=='object'){ s.pagos = {}; mudou = true; }   // checklist de pagamentos por mês
  if((s.version||0) < 6){
    // v6: Lista de compras, Reserva de emergência, Extrato bancário (campos novos; nada do que existia muda)
    s.version = 6; mudou = true;
  }
  const g = (o,k,v) => { if(o[k]==null || typeof o[k]!==typeof v){ o[k] = v; mudou = true; } return o[k]; };   // garante a forma dos campos novos (também em backups importados)
  if(!Array.isArray(s.compras)){ s.compras = []; mudou = true; }
  const R = g(s,'reserva',{}); g(R,'saldo',0); g(R,'metaMeses',6); g(R,'custoRef',0); g(R,'aporte',0); if(!Array.isArray(R.historico)){ R.historico = []; mudou = true; }
  const E = g(s,'extrato',{}); if(!Array.isArray(E.linhas)){ E.linhas = []; mudou = true; } if(!Array.isArray(E.arquivos)){ E.arquivos = []; mudou = true; } g(E,'regras',{});
  return mudou;
}
const catNomes = () => state.categorias.map(c=>c.nome);
const subsDe = nome => { const c = state.categorias.find(c=>c.nome===nome); return c ? c.subs : []; };

const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mi = s => { if(!s || !/^\d{4}-\d{2}$/.test(s)) return null; const [y,m]=s.split('-').map(Number); return y*12+m-1; };
const miStr = n => `${Math.floor(n/12)}-${String(n%12+1).padStart(2,'0')}`;
const fmtMes = n => `${MES[n%12]}/${Math.floor(n/12)}`;
const fmtMesCurto = n => `${MES[n%12]}/${String(Math.floor(n/12)).slice(2)}`;
const fmtMesLongo = n => `${MES_LONGO[n%12]} de ${Math.floor(n/12)}`;
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => BRL.format(Math.round((v||0)*100)/100 + 0);
const pct = v => (v*100).toFixed(1).replace('.',',')+'%';
const num = v => (v==null||v==='')?0:Number(v)||0;
/* Precisão decimal: todo valor monetário do motor passa por round2 (2 casas) para eliminar erros de ponto flutuante. */
const round2 = val => Math.round((val + Number.EPSILON) * 100) / 100;
const sum = (a,f) => round2(a.reduce((t,x)=>t+f(x),0));

function h(tag, a, ...kids){
  const el = document.createElement(tag);
  let props = null;
  if(typeof a==='string'){
    el.className = a;
    const f = kids[0];
    if(f && typeof f==='object' && !f.nodeType && !Array.isArray(f)) props = kids.shift();   // h('div','classes',{atributos}, ...filhos)
  } else props = a;
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='value') el.value = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, props, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for(const [k,v] of Object.entries(props||{})) if(v!=null) el.setAttribute(k,v);
  for(const kid of kids.flat(Infinity)) if(kid!=null) el.append(kid.nodeType?kid:document.createTextNode(kid));
  return el;
}
const ic = (name, cls='w-4 h-4') => h('i',{'data-lucide':name,class:cls});
const icons = () => { try{ if(window.lucide) window.lucide.createIcons(); }catch(e){} };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };

/* ═════════════ Segurança: senha, criptografia e recuperação ═════════════
   • Os dados ficam criptografados (AES-256-GCM) no perfil local deste computador.
   • A chave de dados é aleatória e fica "embrulhada" por duas chaves: uma derivada da SENHA e outra do CÓDIGO DE RECUPERAÇÃO
     (PBKDF2-SHA256, 600 mil iterações). Sem a senha ou o código, os dados não podem ser abertos — nem por mim. */
const K_AUTH='cf-auth-v1', K_DATA='cf-data-v1', K_LEGACY='controle-financeiro-v1', K_FAILS='cf-fails-v1', K_AUTOLOCK='cf-autolock', K_THEME='cf-theme';
const ITER = 600000;
const enc = new TextEncoder(), dec = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = buf => { const a = new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function derive(secret, salt, iter=ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, bytes){ const iv = rand(12); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes); return { iv:b64(iv), ct:b64(ct) }; }
async function aesDec(key, o){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct))); }
const importDK = raw => crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
const ALFA = 'ABCDEFGHJKMNPQRSTVWXYZ23456789';
const novoCodigo = () => { let s=''; for(const b of rand(20)) s += ALFA[b % ALFA.length]; return s.match(/.{5}/g).join('-'); };
const normRec = c => String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

let state = null, dataKey = null;
const getAuth = () => { try{ return JSON.parse(lsGet(K_AUTH)); }catch(e){ return null; } };

async function criarConta(senha, estadoInicial){
  const saltP = rand(16), saltR = rand(16), code = novoCodigo();
  const kP = await derive(senha, saltP), kR = await derive(normRec(code), saltR);
  const raw = rand(32);
  dataKey = await importDK(raw);
  lsSet(K_AUTH, JSON.stringify({ v:1, iter:ITER, saltP:b64(saltP), saltR:b64(saltR), wrapP:await aesEnc(kP, raw), wrapR:await aesEnc(kR, raw) }));
  state = estadoInicial;
  await persistNow();
  return code;
}
async function carregarDados(){
  const raw = lsGet(K_DATA);
  if(!raw){ state = SEED(); await persistNow(); return; }
  const s = JSON.parse(dec.decode(await aesDec(dataKey, JSON.parse(raw))));
  if(!valid(s)) throw new Error('dados inválidos');
  const mudou = migrar(s);
  state = s;
  if(mudou) await persistNow();     // grava já no formato novo (categoria > subcategoria)
}
async function destrancar(senha){
  const auth = getAuth();
  const kP = await derive(senha, unb64(auth.saltP), auth.iter);
  const raw = await aesDec(kP, auth.wrapP);              // falha se a senha estiver errada
  dataKey = await importDK(raw);
  await carregarDados();
}
async function abrirComSenha(senha){ const auth = getAuth(); const kP = await derive(senha, unb64(auth.saltP), auth.iter); return { auth, raw: await aesDec(kP, auth.wrapP) }; }
async function trocarSenha(atual, nova){
  const { auth, raw } = await abrirComSenha(atual);
  const saltP = rand(16), kP = await derive(nova, saltP, auth.iter);
  auth.saltP = b64(saltP); auth.wrapP = await aesEnc(kP, raw);
  lsSet(K_AUTH, JSON.stringify(auth));
}
async function gerarNovoCodigo(senha){
  const { auth, raw } = await abrirComSenha(senha);
  const code = novoCodigo(), saltR = rand(16), kR = await derive(normRec(code), saltR, auth.iter);
  auth.saltR = b64(saltR); auth.wrapR = await aesEnc(kR, raw);
  lsSet(K_AUTH, JSON.stringify(auth));
  return code;
}
async function recuperar(codigo, novaSenha){
  const auth = getAuth();
  const kR = await derive(normRec(codigo), unb64(auth.saltR), auth.iter);
  const raw = await aesDec(kR, auth.wrapR);              // falha se o código estiver errado
  const saltP = rand(16), kP = await derive(novaSenha, saltP, auth.iter);
  const code = novoCodigo(), saltR = rand(16), kR2 = await derive(normRec(code), saltR, auth.iter);
  auth.saltP = b64(saltP); auth.wrapP = await aesEnc(kP, raw);
  auth.saltR = b64(saltR); auth.wrapR = await aesEnc(kR2, raw);
  lsSet(K_AUTH, JSON.stringify(auth));
  dataKey = await importDK(raw);
  await carregarDados();
  return code;
}

/* Salvamento: criptografa e grava NA HORA (sem espera/debounce). Edições feitas durante uma gravação em andamento
   são agrupadas numa gravação seguinte. O WebCrypto é assíncrono (não existe versão síncrona), então a gravação
   começa no mesmo instante da edição e a janela de risco ao fechar a janela é de poucos milissegundos. */
let dirty = false, gravando = false, saving = Promise.resolve();
function save(){ if(!state || !dataKey) return; dirty = true; flushSave(); }
function flushSave(){
  if(gravando) return saving;
  gravando = true;
  saving = (async()=>{
    try{
      while(dirty && state && dataKey){
        dirty = false;
        const snap = JSON.stringify(state), key = dataKey;
        lsSet(K_DATA, JSON.stringify(await aesEnc(key, enc.encode(snap))));
        agendaBackupAuto();
      }
    }catch(e){} finally { gravando = false; }
  })();
  return saving;
}
const persistNow = () => { if(state && dataKey) dirty = true; return flushSave(); };
// ao fechar/esconder a janela: qualquer gravação pendente é disparada imediatamente
const flushAoSair = () => { if(dirty || gravando) flushSave(); };
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAoSair(); });
window.addEventListener('beforeunload', flushAoSair);
window.addEventListener('pagehide', flushAoSair);
/* Duas janelas do app abertas ao mesmo tempo: quando outra janela salva, esta recarrega os dados
   (evita que uma sobrescreva a outra com informação antiga). */
window.addEventListener('storage', async e=>{
  if(e.key!==K_DATA || !e.newValue || !state || !dataKey) return;
  try{
    const s = JSON.parse(dec.decode(await aesDec(dataKey, JSON.parse(e.newValue))));
    if(valid(s)){ dirty = false; state = s; render(); }
  }catch(err){}
});

/* Tentativas erradas: espera crescente */
const fails = () => { try{ return JSON.parse(lsGet(K_FAILS)||'{}'); }catch(e){ return {}; } };
const esperaRestante = () => Math.max(0, (fails().until||0) - Date.now());
function registraFalha(){ const f = fails(); const n=(f.n||0)+1; lsSet(K_FAILS, JSON.stringify({ n, until: n>=3 ? Date.now()+Math.min(60000, 1000*Math.pow(2,n-3)) : 0 })); }
const limpaFalhas = () => lsDel(K_FAILS);

/* Bloqueio automático por inatividade */
let idleTimer = null;
const autoLockMin = () => { const v = lsGet(K_AUTOLOCK); return v==null ? 15 : Number(v); };
function armIdle(){ clearTimeout(idleTimer); const m = autoLockMin(); if(state && m>0) idleTimer = setTimeout(bloquear, m*60000); }
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>window.addEventListener(ev, ()=>{ if(state) armIdle(); }, {passive:true}));
async function bloquear(){
  clearTimeout(idleTimer);
  await persistNow();
  state = null; dataKey = null; afterRender.length = 0;
  $('#view').replaceChildren(); closeModal();
  showLock('unlock');
}

/* ═════════════ Regras de cálculo (idênticas às da planilha) ═════════════ */
const recSpan = r => {
  const s = mi(r.inicio); if(s==null) return null;
  const e = r.tipo==='Única' ? s : mi(r.fim);
  return { s, e: e==null ? null : e };
};
const despSpan = d => {
  const s = mi(d.inicio); if(s==null) return null;
  let e = null;
  if(d.tipo==='Única') e = s;
  else if(d.tipo==='Parcelada' && d.parcelas) e = s + Number(d.parcelas) - 1;
  else e = mi(d.fim);
  return { s, e: e==null ? null : e };
};
const active = (sp,m) => !!sp && sp.s<=m && (sp.e==null || m<=sp.e);
const valorMesRec = (r,m) => (r.valor==null||r.valor==='') ? 0 : (active(recSpan(r),m) ? round2(num(r.valor)) : 0);
const baseImposto = r => {
  if(r.tributavel==='Não') return 0;
  if(r.valor==null||r.valor==='') return 0;
  return round2((r.nota==null||r.nota==='') ? num(r.valor) : num(r.nota));
};
const impostoGerado = (r,m) => valorMesRec(r,m)===0 ? 0 : round2(baseImposto(r)*state.params.aliquota);
const firstDesp = nome => state.despesas.find(d=>d.descricao===nome);
/* v5: o ajuste liga à despesa pelo ID (a.despesaId). Ajustes antigos sem ID válido caem no fallback pela descrição (a.despesa). */
const despDoAjuste = a => (a.despesaId && state.despesas.find(d=>d.id===a.despesaId)) || (a.despesa ? firstDesp(a.despesa) : null) || null;
function ajusteInfo(a){
  const d = despDoAjuste(a);
  const m = mi(a.mes);
  const padrao = d ? round2(num(d.valor)) : 0;
  const ativa = !!(d && m!=null && active(despSpan(d), m));
  const temValor = !(a.valor==null||a.valor==='');
  const dif = (temValor && ativa) ? round2(num(a.valor)-padrao) : 0;
  return { padrao, ativa, dif, d };
}
const diffAjustes = (d,m) => sum(state.ajustes.filter(a=>mi(a.mes)===m && despDoAjuste(a)===d), a=>ajusteInfo(a).dif);
const valorMes = (d,m) => {
  const base = (d.valor==null||d.valor==='') ? 0 : (active(despSpan(d),m) ? num(d.valor) : 0);
  return round2(base + diffAjustes(d,m));
};

const ehPago = (id, m) => !!(state.pagos && (state.pagos[miStr(m)]||[]).includes(id));
function marcaPago(id, m, on){
  state.pagos = state.pagos || {};
  const k = miStr(m), l = new Set(state.pagos[k]||[]);
  if(on) l.add(id); else l.delete(id);
  if(l.size) state.pagos[k] = [...l]; else delete state.pagos[k];
  save();
  if(typeof render==='function' && tab!=='despesas') render(); else refreshPagamentosVisuais();
}

/* resumo do mês (já no escopo do summary S): quanto do comprometido foi pago e quanto falta */
function resumoPagamentos(S){
  const itens = S.rows.filter(x=>x.v>0).map(x=>({ id:x.d.id, v:x.v }));
  if(S.tax.imposto>0 && S.esc!=='pessoal') itens.push({ id:IMPOSTO_ID, v:S.tax.imposto });
  const pagos = itens.filter(i=>ehPago(i.id, S.m));
  const pago = sum(pagos, i=>i.v);
  return { pago, falta: round2(Math.max(0, S.comprometido - pago)), n: itens.length, nPagas: pagos.length, pct: S.comprometido>0 ? Math.min(1, pago/S.comprometido) : 0 };
}
const mesesRestantes = (d,m) => { const sp = despSpan(d); if(!sp || sp.e==null) return null; return Math.max(0, sp.e - Math.max(sp.s, m+1) + 1); };
const saldoFuturo = (d,m) => { const r = mesesRestantes(d,m); return (r==null||d.valor==null||d.valor==='') ? 0 : round2(r*num(d.valor)); };
const parcelaLabel = (d,m) => {
  if(d.tipo!=='Parcelada' || !d.parcelas) return '';
  const sp = despSpan(d); if(!active(sp,m)) return '';
  return `${m-sp.s+1}/${d.parcelas}`;
};
function taxInfo(m){
  const P = state.params;
  const ref = m - P.lag;
  const recebido = sum(state.receitas, r=>valorMesRec(r,ref));
  const nota = sum(state.receitas, r=>active(recSpan(r),ref) ? baseImposto(r) : 0);
  return { ref, recebido, nota, fora: round2(recebido-nota), aliquota: P.aliquota, imposto: round2(nota*P.aliquota) };
}

function status(receita, p){
  const P = state.params;
  if(!receita) return 'none';
  if(p>=P.limCritico) return 'bad';
  if(p>=P.limAtencao) return 'warn';

const EMPRESA = 'Empresa / Profissional';
const ESCOPOS = [['tudo','Tudo'],['pessoal','Pessoal'],['empresa','Empresa']];
/* esc: 'tudo' (padrão) | 'pessoal' (sem a categoria Empresa / Profissional e sem o imposto)
        | 'empresa' (só Empresa / Profissional + imposto; receita = valor da NOTA das receitas com nota) */
function summary(m, esc='tudo'){
  const P = state.params;
  const noEscopo = d => esc==='tudo' || (esc==='empresa' ? d.categoria===EMPRESA : d.categoria!==EMPRESA);
  const receita = sum(state.receitas, r=> esc==='empresa' ? (active(recSpan(r),m) ? baseImposto(r) : 0) : valorMesRec(r,m));
  const desps = state.despesas.filter(noEscopo);
  const rows = desps.map(d=>({ d, v: valorMes(d,m) }));
  const porTipo = { Fixa:0, Parcelada:0, 'Única':0 };
  // Categoria principal consolidada, com o detalhamento por subcategoria ('' = sem subcategoria)
  const porCat = new Map(state.categorias.map(c=>[c.nome, { v:0, subs:new Map(c.subs.map(s=>[s,0])) }]));
  const addCat = (cat, sub, v) => {
    let e = porCat.get(cat);
    if(!e){ e = { v:0, subs:new Map() }; porCat.set(cat, e); }
    e.v = round2(e.v + v); const k = sub||''; e.subs.set(k, round2((e.subs.get(k)||0) + v));
  };
  for(const {d,v} of rows){
    porTipo[d.tipo] = round2((porTipo[d.tipo]||0)+v);
    addCat(d.categoria||'Outros', d.sub, v);
  }
  const tax0 = taxInfo(m);
  const tax = esc==='pessoal' ? { ...tax0, imposto:0 } : tax0;
  if(esc!=='pessoal') addCat(P.impostoCat, P.impostoSub, tax.imposto);
  const desp = sum(rows, x=>x.v);
  const comprometido = round2(desp + tax.imposto);
  const p = receita ? comprometido/receita : null;
  const fins = desps.filter(d=>d.tipo==='Parcelada').map(despSpan).filter(sp=>sp&&sp.e!=null).map(sp=>sp.e);
  return {
    m, esc, receita, rows, porTipo, porCat, tax, desp, comprometido, saldo: round2(receita-comprometido), p,
    futuro: sum(desps, d=>saldoFuturo(d,m)),
    ultima: fins.length ? Math.max(...fins) : null,
    st: status(receita, p)
  };
}

function gauge(S){
  const P = state.params, T = TONE[S.st];
  const SIZE = 232, c = SIZE/2, r = 88, sw = 14;
  const C = 2*Math.PI*r, L = C*0.75;
  const p = S.p==null ? 0 : Math.min(S.p,1);
  const gid = 'gg'+Math.random().toString(36).slice(2,6);
  const svg = sv('svg',{viewBox:`0 6 ${SIZE} 196`,class:'w-full h-full',preserveAspectRatio:'xMidYMid meet',role:'img','aria-label':`Comprometimento: ${S.p==null?'indisponível':pct(S.p)}`});
  svg.append(sv('defs',{},
    sv('linearGradient',{id:gid,x1:'0',y1:'1',x2:'1',y2:'0'},
      sv('stop',{offset:'0%',style:`stop-color:rgb(var(${T.a}))`}),
      sv('stop',{offset:'100%',style:`stop-color:rgb(var(${T.b}))`}))));
  const rot = `rotate(135 ${c} ${c})`;
  svg.append(sv('circle',{cx:c,cy:c,r,fill:'none','stroke-width':sw,'stroke-linecap':'round',style:'stroke:rgb(var(--fg) / .08)','stroke-dasharray':`${L} ${C}`,transform:rot}));
  if(p>0) svg.append(sv('circle',{cx:c,cy:c,r,fill:'none',stroke:`url(#${gid})`,'stroke-width':sw,'stroke-linecap':'round','stroke-dasharray':`${L*p} ${C}`,transform:rot}));
  for(const f of [P.limAtencao,P.limCritico]){
    const g = sv('g',{transform:`rotate(${135 + 270*f} ${c} ${c})`});
    g.append(sv('line',{x1:c+r+sw/2+3,y1:c,x2:c+r+sw/2+9,y2:c,style:'stroke:rgb(var(--fg) / .5)','stroke-width':1.6,'stroke-linecap':'round'}));
    svg.append(g);
  }
  svg.append(sv('text',{x:c,y:c+8,'text-anchor':'middle',style:'font-size:46px;font-weight:600;fill:rgb(var(--fg));letter-spacing:-.03em;font-variant-numeric:tabular-nums'}, S.p==null?'n/d':pct(S.p)),
    sv('text',{x:c,y:c+31,'text-anchor':'middle',style:'font-size:12px;fill:rgb(var(--mut))'}, 'da receita comprometida'));
  return svg;
}

/* ═════════════ INSIGHTS AUTOMÁTICOS (regras fixas: instantâneos, sem IA e sem internet) ═════════════
   Cada regra olha os dados do app e devolve uma frase com tom (bad/warn/info/ok) e peso; o Painel mostra os mais importantes. */
function gerarInsights(m, esc='tudo'){
  const P = state.params, S = summary(m, esc), out = [];
  const add = (tom, icone, texto, peso) => out.push({ tom, icone, texto, peso });
  const hoje = new Date(), mesHoje = nowMonth(), ehMesAtual = m === mesHoje;
  /* 1 · folga do mês */
  if(!S.receita) add('info','info',`Sem receita cadastrada em ${fmtMes(m)}: cadastre as receitas para ver o comprometimento.`,50);
  else if(S.saldo < 0) add('bad','triangle-alert',`As contas de ${fmtMes(m)} passam da receita em ${brl(-S.saldo)}.`,110);
  else if(S.p >= P.limCritico) add('bad','triangle-alert',`${fmtMes(m)}: ${pct(S.p)} da receita comprometida, acima do limite crítico (${pct(P.limCritico)}). Sobram só ${brl(S.saldo)}.`,100);
  else if(S.p >= P.limAtencao) add('warn','triangle-alert',`${fmtMes(m)}: ${pct(S.p)} da receita comprometida, acima do limite de atenção (${pct(P.limAtencao)}). Sobram ${brl(S.saldo)}.`,70);
  else add('ok','circle-check',`${fmtMes(m)} está dentro do saudável: ${pct(S.p)} comprometido, sobram ${brl(S.saldo)}.`,10);
  /* 2 · mês mais apertado à frente */
  const prox = Array.from({length:6},(_,i)=>summary(m+1+i, esc)).filter(x=>x.receita>0);
  const pior = prox.slice().sort((a,b)=>b.p-a.p)[0];
  if(pior && pior.p >= P.limAtencao && !(S.p>=pior.p)) add(pior.saldo<0?'bad':pior.p>=P.limCritico?'warn':'info','calendar-clock',`O mês mais apertado dos próximos 6 é ${fmtMes(pior.m)}: ${pct(pior.p)} comprometido, sobram ${brl(pior.saldo)}.`,80);
  /* 3 · parcelas que acabam */
  for(const {d,v} of S.rows){
    if(d.tipo!=='Parcelada' || v===0) continue;
    const sp = despSpan(d); if(!sp || sp.e==null) continue;
    const resta = sp.e - m;
    if(resta===0) add('info','calendar-check',`Última parcela de ${d.descricao||'(sem descrição)'} é em ${fmtMes(m)} (${brl(v)}). A partir de ${fmtMes(m+1)} libera ${brl(v)} por mês.`,60);
    else if(resta>0 && resta<=3) add('info','calendar-check',`${d.descricao||'(sem descrição)'}: faltam ${resta} parcelas (a última é em ${fmtMes(sp.e)}). Depois libera ${brl(v)} por mês.`,50);
  }
  if(S.ultima!=null && S.ultima>m){
    const depois = summary(S.ultima+1, esc);
    if(depois.receita>0) add('ok','sparkles',`Quando a última parcela acabar (${fmtMes(S.ultima)}), a sobra mensal passa para ${brl(depois.saldo)}.`,30);
  }
  /* 4 · vencimentos (só no mês atual; usa o dia de vencimento e o checklist "Pago") */
  if(ehMesAtual){
    const hd = hoje.getDate(), ultDia = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    const venc = S.rows.filter(x=>x.d.dia && x.v>0 && !ehPago(x.d.id, m)).map(x=>({ ...x, due:Math.min(+x.d.dia, ultDia) })).sort((a,b)=>a.due-b.due);
    const atrasadas = venc.filter(x=>x.due<hd), proximas = venc.filter(x=>x.due>=hd && x.due-hd<=7);
    if(atrasadas.length) add('bad','alarm-clock',`Venceu e não está marcada como paga: ${atrasadas.slice(0,3).map(x=>`${x.d.descricao||'conta'} (dia ${x.due})`).join(', ')}${atrasadas.length>3?` e mais ${atrasadas.length-3}`:''}.`,95);
    for(const x of proximas.slice(0,3)) add('warn','alarm-clock', x.due===hd ? `${x.d.descricao||'Conta'} vence hoje (${brl(x.v)}).` : `${x.d.descricao||'Conta'} vence em ${x.due-hd} dia${x.due-hd===1?'':'s'} (dia ${x.due}): ${brl(x.v)}.`, 90-(x.due-hd));
    const pg = resumoPagamentos(S);
    if(pg.n>0 && pg.falta>0 && !venc.length) add('info','hourglass',`Faltam pagar ${brl(pg.falta)} em ${pg.n-pg.nPagas} conta${pg.n-pg.nPagas===1?'':'s'} deste mês.`,20);
  }
  /* 5 · reserva de emergência */
  const ri = reservaInfo();
  if(!ri.R.historico.length) add('info','piggy-bank','Informe quanto você tem guardado na aba Reserva para acompanhar sua reserva de emergência.',25);
  else if(ri.cobertura < 1) add('warn','piggy-bank',`Sua reserva cobre só ${fmtMeses(ri.cobertura)} mês de despesas (meta: ${ri.metaMeses}). Faltam ${brl(ri.falta)}.`,65);
  else if(ri.falta > 0) add('info','piggy-bank',`Sua reserva cobre ${fmtMeses(ri.cobertura)} meses de despesas (meta: ${ri.metaMeses}). Faltam ${brl(ri.falta)}.`,35);
  else add('ok','piggy-bank',`Reserva de emergência na meta: cobre ${fmtMeses(ri.cobertura)} meses de despesas.`,12);
  /* 6 · lista de compras */
  const pend = state.compras.filter(c=>c.status!=='Comprado' && num(c.valor)>0 && mi(c.mes)!=null);
  const naoCabe = pend.map(c=>({ c, r:compraCabe(c) })).filter(x=>x.r && !x.r.ok).sort((a,b)=>(PRIO[a.c.prioridade]??1)-(PRIO[b.c.prioridade]??1))[0];
  if(naoCabe) add('warn','shopping-cart',`${naoCabe.c.item||'Item'} (${brl(naoCabe.c.valor)}) em ${fmtMes(mi(naoCabe.c.mes))} não cabe na sobra do mês: faltam ${brl(-naoCabe.r.sobra)}.`,55);
  else if(pend.length) add('ok','shopping-cart',`${pend.length} ite${pend.length===1?'m':'ns'} da lista de compras ${pend.length===1?'cabe':'cabem'} na sobra dos meses planejados.`,15);
  /* 7 · extrato: onde o gasto real passou do planejado */
  const ls = linhasDoMes(m);
  if(ls.length){
    const real = new Map(); for(const l of ls){ const g = gastoDe(l); if(g) real.set(l.cat, round2((real.get(l.cat)||0)+g)); }
    const dif = [...real.entries()].map(([c,r])=>({ c, r, p:(S.porCat.get(c)||{v:0}).v })).map(x=>({ ...x, d:round2(x.r-x.p) })).sort((a,b)=>b.d-a.d)[0];
    if(dif && dif.d > 50) add('warn','receipt-text',`Extrato de ${fmtMes(m)}: ${dif.c} teve ${brl(dif.r)} de gasto real contra ${brl(dif.p)} planejado (${brl(dif.d)} a mais).`,65);
  }
  return out.sort((a,b)=>b.peso-a.peso);
}

  return root;

/* ═════════════ PROJEÇÃO (12 meses) — matriz de fluxo futuro ═════════════ */
/* Simulador de nova compra — só simulação: NADA é gravado em state/localStorage.
   valor = valor de CADA parcela (igual ao cadastro de despesas); 1 parcela = compra à vista num mês. */
const sim = { valor:'', parcelas:'', inicio:'' };
const simAtivo = () => num(sim.valor) > 0;
function simExtra(m){
  if(!simAtivo()) return 0;
  const n = Math.max(1, Math.min(600, Math.round(num(sim.parcelas)) || 1));
  const ini = mi(sim.inicio);
  if(ini==null || m<ini || m>=ini+n) return 0;
  return round2(num(sim.valor));
}
function simPonto(p){
  const extra = simExtra(p.m), c = round2(p.comprometido + extra), pp = p.receita>0 ? c/p.receita : null;
  return { extra, c, p:pp, st:status(p.receita, pp), saldo:round2(p.saldo - extra) };
}

function viewProjecao(){
  const proj = Array.from({length:12},(_,i)=>summary(month+i));
  const S0 = proj[0];
  const media = sum(proj,p=>p.comprometido)/12;
  const recMedia = sum(proj,p=>p.receita)/12;
  const comP = proj.filter(p=>p.p!=null);
  const aperto = comP.length ? comP.reduce((a,b)=>b.p>a.p?b:a) : null;
  const parcMes = S0.porTipo.Parcelada||0;
  const fimParc = S0.ultima;                         // último mês com parcela (entre todos os parcelamentos)
  const saldoAcum = sum(proj,p=>p.saldo);

  // meses em que algum parcelamento termina
  const fins = new Map();
  state.despesas.filter(d=>d.tipo==='Parcelada').forEach(d=>{
    const sp = despSpan(d); if(!sp || sp.e==null) return;
    if(!fins.has(sp.e)) fins.set(sp.e, []);
    fins.get(sp.e).push(d.descricao);
  });

  /* Topo: 4 KPIs em linha */
  const kpis = h('section','glass rounded-2xl lg:col-span-12 overflow-hidden grid grid-cols-2 lg:grid-cols-4',
    kpiCell('gauge','Média de gastos (12 meses)', brl(media), recMedia>0 ? `${pct(media/recMedia)} da receita média` : '—', 'border-r border-b lg:border-b-0 border-hair'),
    kpiCell('flame','Mês mais apertado', aperto ? fmtMes(aperto.m) : '–', aperto ? `${pct(aperto.p)} comprometido · saldo ${brl(aperto.saldo)}` : '—', 'border-b lg:border-b-0 lg:border-r border-hair'),
    kpiCell('piggy-bank','Economia após fim das parcelas', parcMes>0 ? `${brl(parcMes)}/mês` : '–', fimParc!=null && parcMes>0 ? `a partir de ${fmtMes(fimParc+1)}` : 'sem parcelas ativas', 'border-r border-hair'),
    kpiCell('wallet','Saldo livre acumulado (12m)', brl(saldoAcum), `média de ${brl(saldoAcum/12)} por mês`, ''));

  /* Simulador de nova compra (topo): painel compacto de uma linha; o gráfico e a matriz são redesenhados no lugar */
  if(!mi(sim.inicio)) sim.inicio = miStr(month+1);
  const maxSim = () => Math.max(...proj.map(p=>Math.max(p.receita, p.comprometido + simExtra(p.m))), 1) * 1.04;
  const seg = (v,bg) => v>0 ? h('div','w-full',{style:`flex:${v} 1 0;min-height:1px;background:${bg}`}) : null;

  function mkColunas(){
    const maxV = maxSim(), ativo = simAtivo() && proj.some(p=>simExtra(p.m)>0);   // sem mês afetado, não desenha a linha
    const pts = proj.map(simPonto);
    const yPct = i => pts[i].c / maxV * 100;                           // altura (% a partir da base) do nível "com a compra"
    return proj.map((p,i)=>{
      const parc = p.porTipo.Parcelada||0, fix = p.comprometido-parc, livre = Math.max(0,p.saldo);
      const estouro = p.receita>0 && p.comprometido>p.receita;
      const fimN = fins.get(p.m), sp = pts[i], afeta = ativo && sp.extra>0;
      let linhaSim = null, ponto = null;
      if(ativo){
        const yc = 100 - yPct(i);
        const yl = i>0 ? 100 - (yPct(i-1)+yPct(i))/2 : yc, yr = i<11 ? 100 - (yPct(i+1)+yPct(i))/2 : yc;
        linhaSim = sv('svg',{viewBox:'0 0 100 100',preserveAspectRatio:'none',class:'absolute pointer-events-none',
          style:'left:-0.1875rem;top:0;height:100%;width:calc(100% + 0.375rem);overflow:visible','aria-hidden':'true'},
          sv('polyline',{points:`0,${yl.toFixed(2)} 50,${yc.toFixed(2)} 100,${yr.toFixed(2)}`,fill:'none',stroke:'rgb(var(--fg))','stroke-width':'2','stroke-dasharray':'5 4','stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke',opacity:'.92'}));
        if(afeta) ponto = h('span','absolute w-2 h-2 rounded-full pointer-events-none',{style:`left:50%;bottom:${yPct(i).toFixed(2)}%;transform:translate(-50%,50%);background:rgb(var(--fg));box-shadow:0 0 0 2px rgb(var(--bg))`});
      }
      const mostra = afeta ? sp : p;
      return h('div','flex flex-col min-w-0 min-h-0 h-full',
        {title:`${fmtMesLongo(p.m)}\nReceita ${brl(p.receita)}\nFixas (inclui únicas e imposto) ${brl(fix)}\nParcelas ${brl(parc)}\nSaldo livre ${brl(p.saldo)}\n${p.p==null?'':pct(p.p)+' comprometido'}${afeta?`\nCom a compra: ${brl(sp.c)} (${sp.p==null?'n/d':pct(sp.p)}) · saldo ${brl(sp.saldo)}`:''}${fimN?'\nFim: '+fimN.join(', '):''}`},
        h('div',`num text-[0.62rem] text-center font-semibold ${TONE[mostra.st].text}`, mostra.p==null?'–':Math.round(mostra.p*100)+'%'),
        h('div','relative flex-1 min-h-0 mt-1',
          h('div',`absolute inset-x-[12%] bottom-0 flex flex-col-reverse rounded-md overflow-hidden ${estouro?'ring-1 ring-coral':''}`,{style:`height:${Math.max(p.receita,p.comprometido)/maxV*100}%`},
            seg(fix,'rgb(var(--indigo))'), seg(parc,'rgb(var(--indigo) / .42)'), seg(livre,'rgb(var(--mint) / .85)')),
          linhaSim, ponto),
        h('div','text-center text-[0.62rem] text-dim mt-1 font-medium', MES[p.m%12]),
        fimN ? h('div','mx-auto w-1.5 h-1.5 rounded-full bg-amber mt-0.5',{title:`Fim: ${fimN.join(', ')}`}) : h('div','h-2'));
    });
  }

  /* Corpo · direita: tabela de 12 meses com mini-barras */
  const ult = fimParc;
  const COLS = 'grid-cols-[3.4rem_minmax(0,1fr)_minmax(0,1.3fr)_minmax(0,1fr)_minmax(0,1.5fr)]';
  function mkLinhas(){
    const ativo = simAtivo();
    return proj.map((p,i)=>{
      const parc = p.porTipo.Parcelada||0, fimN = fins.get(p.m), quitou = ult!=null && p.m===ult+1;
      const sp = simPonto(p), afeta = ativo && sp.extra>0;
      const T = TONE[p.st], T2s = TONE[sp.st];
      const destaque = afeta ? 'bg-fg/[0.06] ring-1 ring-inset ring-fg/25' : fimN ? 'bg-amber/[0.09] ring-1 ring-inset ring-amber/30' : quitou ? 'bg-income/[0.08] ring-1 ring-inset ring-income/25' : '';
      const w = p.p==null ? 0 : Math.min(p.p,1)*100;
      const wSim = sp.p==null ? 0 : Math.min(sp.p,1)*100;
      return h('div',`rowh grid ${COLS} items-center gap-3 px-3 rounded-lg min-h-0 ${destaque}`,
        h('div',`num text-[0.8rem] ${i===0?'font-semibold':'text-mut'}`, fmtMesCurto(p.m)),
        h('div','num text-[0.8125rem] text-right', afeta ? h('span','',brl(sp.c)) : brl(p.comprometido)),
        h('div','flex items-center gap-2 min-w-0',
          h('div','track flex-1 !h-2 relative',
            h('div','fill',{style:`width:${w}%;background:linear-gradient(90deg, rgb(var(${T.a}) / .55), rgb(var(${T.b})))`}),
            afeta ? h('span','absolute top-[-2px] bottom-[-2px] border-r-2 border-dashed',{style:`left:${wSim}%;border-color:rgb(var(--fg))`}) : null),
          afeta ? h('span',`num text-[0.68rem] shrink-0 text-right font-semibold whitespace-nowrap ${T2s.text}`, (p.p==null?'–':Math.round(p.p*100)+'%')+' → '+(sp.p==null?'–':Math.round(sp.p*100)+'%'))
                : h('span',`num text-[0.7rem] w-10 text-right font-semibold ${T.text}`, p.p==null?'–':pct(p.p))),
        h('div',`num text-[0.8125rem] text-right ${(afeta?sp.saldo:p.saldo)<0?'text-coral font-semibold':''}`, brl(afeta ? sp.saldo : p.saldo)),
        h('div','flex items-center gap-1.5 min-w-0',
          h('span','num text-[0.72rem] text-dim shrink-0', parc>0?brl(parc):'—'),
          afeta ? h('span','truncate rounded-full px-1.5 py-0.5 text-[0.64rem] font-semibold bg-fg/10 text-fg',{title:'Nova compra simulada: +'+brl(sp.extra)},'+ '+brl(sp.extra)+' simulada') : null,
          fimN ? h('span','truncate rounded-full px-1.5 py-0.5 text-[0.64rem] font-semibold bg-amber/15 text-amber',{title:'Fim: '+fimN.join(', ')},'Fim · '+fimN.join(', '))
               : quitou ? h('span','truncate rounded-full px-1.5 py-0.5 text-[0.64rem] font-semibold bg-income/15 text-income','Parcelas quitadas') : null));
    });
  }

  const gridCols = h('div','grid grid-cols-12 gap-1.5 flex-1 min-h-[12rem]');
  const linhasBox = h('div','flex-1 min-h-0 grid gap-0.5',{style:'grid-template-rows:repeat(12,minmax(0,1fr))'});
  const legSim = h('span','flex items-center gap-1.5',h('i','inline-block w-4 border-t-2 border-dashed',{style:'border-color:rgb(var(--fg))'}),'Com a compra');
  const resumoEl = h('div','text-[0.72rem] text-dim flex-1 min-w-[16rem]');
  const btnLimpar = h('button','btn !h-8',{type:'button',onclick:()=>{ sim.valor=''; sim.parcelas=''; sim.inicio=miStr(month+1); vIn.value=''; nIn.value=''; mIn.value=sim.inicio; desenha(); }}, ic('eraser','w-4 h-4'),'Limpar');

  function textoResumo(){
    if(!simAtivo()) return 'Preencha o valor para ver quanto uma nova compra pesaria nos próximos 12 meses. Nada é salvo.';
    const pts = proj.map(simPonto), afetados = pts.filter(x=>x.extra>0).length;
    if(!afetados) return 'Esse início fica fora da janela de 12 meses exibida (ou o valor é zero).';
    const comAntes = proj.filter(p=>p.p!=null), comDepois = pts.filter(x=>x.p!=null);
    const picoA = comAntes.length ? Math.max(...comAntes.map(p=>p.p)) : null;
    const iD = comDepois.length ? pts.reduce((b,x,i)=> x.p!=null && (b<0 || x.p>pts[b].p) ? i : b, -1) : -1;
    const extraTot = sum(pts,x=>x.extra), n = Math.max(1, Math.round(num(sim.parcelas)) || 1);
    const neg = pts.filter((x,i)=>x.saldo<0 && proj[i].saldo>=0).length;
    const partes = [];
    if(picoA!=null && iD>=0) partes.push(`Pico de comprometimento ${pct(picoA)} → ${pct(pts[iD].p)} (${fmtMesCurto(proj[iD].m)})`);
    partes.push(`Saldo livre acumulado (12m) ${brl(saldoAcum)} → ${brl(round2(saldoAcum-extraTot))}`);
    if(neg>0) partes.push(`${neg} ${neg>1?'meses':'mês'} a mais no vermelho`);
    partes.push(`Total da compra ${brl(round2(num(sim.valor)*n))} em ${n}×`);
    return partes.join(' · ');
  }
  function desenha(){
    gridCols.replaceChildren(...mkColunas());
    linhasBox.replaceChildren(...mkLinhas());
    legSim.style.display = simAtivo() ? '' : 'none';
    btnLimpar.style.visibility = (sim.valor!=='' || sim.parcelas!=='') ? '' : 'hidden';
    resumoEl.textContent = textoResumo();
    resumoEl.className = 'text-[0.72rem] flex-1 min-w-[16rem] ' + (simAtivo() ? 'text-fg' : 'text-dim');
  }
  const campo = (rotulo, input) => h('label','flex items-center gap-1.5 text-[0.72rem] text-dim shrink-0', rotulo, input);
  const vIn = h('input','fld',{type:'number',min:'0',step:'0.01',inputmode:'decimal',placeholder:'0,00',value:sim.valor,'aria-label':'Valor de cada parcela da nova compra',style:'width:7rem;height:2rem',
    oninput:e=>{ sim.valor = e.target.value; desenha(); }});
  const nIn = h('input','fld',{type:'number',min:'1',max:'600',step:'1',inputmode:'numeric',placeholder:'1',value:sim.parcelas,'aria-label':'Número de parcelas',style:'width:4.5rem;height:2rem',
    oninput:e=>{ sim.parcelas = e.target.value; desenha(); }});
  const mIn = h('input','fld',{type:'month',value:sim.inicio,'aria-label':'Mês de início da compra',style:'width:11.25rem;height:2rem',
    oninput:e=>{ if(mi(e.target.value)!=null){ sim.inicio = e.target.value; desenha(); } }});
  const simBar = h('section','glass rounded-2xl lg:col-span-12 px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-2',
    h('div','flex items-center gap-2 text-[0.8125rem] font-semibold text-mut shrink-0', ic('shopping-cart','w-4 h-4 text-dim'),'Simular nova compra'),
    campo('Valor da parcela', vIn), campo('Parcelas', nIn), campo('Início', mIn), btnLimpar, resumoEl);

  const grafico = h('section','glass rounded-2xl p-4 lg:col-span-5 flex flex-col min-h-0 overflow-hidden',
    cardTitle('bar-chart-3','Fluxo mês a mês'),
    h('div','flex flex-wrap items-center gap-x-4 gap-y-1 text-[0.68rem] text-dim mb-2 shrink-0',
      h('span','flex items-center gap-1.5',h('i','w-2.5 h-2.5 rounded-sm',{style:'background:rgb(var(--indigo))'}),'Fixas'),
      h('span','flex items-center gap-1.5',h('i','w-2.5 h-2.5 rounded-sm',{style:'background:rgb(var(--indigo) / .42)'}),'Parcelas'),
      h('span','flex items-center gap-1.5',h('i','w-2.5 h-2.5 rounded-sm',{style:'background:rgb(var(--mint) / .85)'}),'Saldo livre'),
      h('span','flex items-center gap-1.5',h('i','w-1.5 h-1.5 rounded-full bg-amber'),'Fim de parcela'),
      legSim),
    gridCols,
    h('p','mt-2 text-[0.68rem] text-dim shrink-0','Fixas inclui despesas únicas e o imposto sobre nota. O % no topo é o comprometimento do mês.'));

  const cab = h('div',`grid ${COLS} items-center gap-3 px-3 pb-1.5 shrink-0`,
    ['Mês','Comprometido','Comprometimento','Saldo livre','Parcelas / evento'].map((t,i)=>h('div',`eyebrow ${i===1||i===3?'text-right':''}`,t)));
  const tabela = h('section','glass rounded-2xl p-4 lg:col-span-7 flex flex-col min-h-0 overflow-hidden',
    cardTitle('table-2','Matriz de fluxo futuro', h('span','text-xs text-dim', fmtMes(proj[0].m)+' → '+fmtMes(proj[11].m))),
    cab, linhasBox);

  desenha();
  return h('div','grid grid-cols-1 lg:grid-cols-12 gap-4 fit-3rows fade-in [&>*]:min-w-0', kpis, simBar, grafico, tabela);
}

/* ═════════════ RECEITAS ═════════════ */
const REC_PILL = {
  rec:  'bg-income/10 text-income ring-income/25',
  prev: 'bg-indigo/10 text-indigo ring-indigo/25',
  fora: 'bg-fg/5 text-dim ring-fg/10'
};
const pad2 = n => String(n).padStart(2,'0');
function recStatus(r, m){
  const sp = recSpan(r);
  if(active(sp,m)) return m<=nowMonth() ? { k:'rec', t:'Recebido' } : { k:'prev', t:'Previsto' };
  if(sp && m<sp.s) return { k:'fora', t:`Começa ${fmtMes(sp.s)}` };
  return { k:'fora', t:'Encerrada' };
}

function taxCard(m){
  const P = state.params;
  const recM = sum(state.receitas, r=>valorMesRec(r,m));
  const nota = sum(state.receitas, r=>active(recSpan(r),m) ? baseImposto(r) : 0);
  const gerado = nota*P.aliquota, venc = m + P.lag;
  const T = taxInfo(m);
  const linha = (k,v,cls='') => h('div','flex items-baseline justify-between gap-3 py-1.5 border-b border-hair last:border-0', h('dt','text-[0.8125rem] text-dim',k), h('dd',`num text-[0.8125rem] font-medium text-right ${cls}`,v));
  return h('section','glass rounded-2xl p-4 flex flex-col shrink-0',
    cardTitle('landmark','Cálculo de imposto sobre nota', h('span','num text-[0.72rem] font-semibold rounded-full px-2 py-0.5 bg-amber/10 text-amber ring-1 ring-amber/25', `Alíquota ${pct(P.aliquota)}`)),
    h('dl','shrink-0',
      linha('Nota de referência', fmtMesLongo(m)),
      linha('Total recebido no mês', brl(recM)),
      linha('Base de cálculo (valor da nota)', brl(nota)),
      linha('Fora da base (isento / sem nota)', brl(recM-nota)),
      linha('Alíquota', pct(P.aliquota)),
      linha('Imposto gerado neste mês', brl(gerado), 'text-amber')),
    h('div','mt-3 rounded-xl bg-amber/10 ring-1 ring-amber/25 p-3 flex items-center justify-between gap-3',
      h('div','min-w-0', h('div','text-[0.8125rem] font-semibold', `Imposto a pagar em ${fmtMes(venc)}`), h('div','text-[0.7rem] text-dim', `vence ${P.lag} mês(es) após o recebimento`)),
      h('div','num text-[1.35rem] font-semibold text-amber shrink-0', brl(gerado))),
    h('div','mt-3 pt-3 border-t border-hair flex items-center justify-between gap-3 text-[0.78rem]',
      h('div','text-dim min-w-0', h('div','',`Neste mês (${fmtMes(m)}) você paga`), h('div','text-[0.68rem]',`referente à nota de ${fmtMes(T.ref)}`)),
      h('div','num font-semibold', brl(T.imposto))));
}

function modalReceita(r){
  const novo = !r;
  const o = r ? { ...r } : { id:uid(), descricao:'', origem:'', tipo:'Recorrente', valor:null, nota:null, tributavel:'Sim', dia:null, inicio:miStr(month), fim:'' };
  const campo = (lbl, el, dica) => h('label','block', h('span','block text-xs text-mut mb-1.5 font-medium',lbl), el, dica?h('span','block text-[0.68rem] text-dim mt-1',dica):null);
  const inp = (tipo, v, extra={}) => h('input','fld',{type:tipo, value:v==null?'':v, ...extra});
  const sel = (opts, v) => { const s = h('select','fld',opts.map(x=>h('option',{value:x},x))); s.value = v; return s; };
  const fDesc = inp('text', o.descricao, {placeholder:'Ex.: Salário, Serviço para cliente X'});
  const fOrig = inp('text', o.origem, {placeholder:'Ex.: Empregador, Cliente, Benefício'});
  const fTipo = sel(['Recorrente','Única'], o.tipo);
  const fValor = inp('number', o.valor, {step:'0.01', inputmode:'decimal', placeholder:'0,00'});
  const fNota = inp('number', o.nota, {step:'0.01', inputmode:'decimal', placeholder:'= valor'});
  const fTrib = sel(['Sim','Não'], o.tributavel);
  const fDia = inp('number', o.dia, {min:'1', max:'31', step:'1', placeholder:'opcional'});
  const fIni = inp('month', o.inicio);
  const fFim = inp('month', o.fim);
  const ajustaFim = () => { fFim.disabled = fTipo.value==='Única'; };
  fTipo.addEventListener('change', ajustaFim); ajustaFim();
  const err = h('p','text-sm text-coral min-h-[1.25rem]',{role:'alert'});
  const salvar = e => {
    e.preventDefault(); err.textContent = '';
    if(!fDesc.value.trim()) return err.textContent = 'Informe a descrição.';
    if(fValor.value==='' || !isFinite(Number(fValor.value))) return err.textContent = 'Informe o valor.';
    if(!mi(fIni.value)) return err.textContent = 'Informe o mês de início.';
    Object.assign(o, { descricao:fDesc.value.trim(), origem:fOrig.value.trim(), tipo:fTipo.value, valor:Number(fValor.value),
      nota: fNota.value===''?null:Number(fNota.value), tributavel:fTrib.value, dia: fDia.value===''?null:Math.min(31,Math.max(1,Math.round(Number(fDia.value)))),
      inicio:fIni.value, fim: fTipo.value==='Única'?'':fIni.value && fFim.value ? fFim.value : '' });
    if(novo) state.receitas.push(o); else Object.assign(r, o);
    save(); closeModal(); render(); toast(novo?'Receita registrada.':'Receita atualizada.');
  };
  openModal([novo?'Nova receita':'Editar receita','max-w-xl'],
    h('form','space-y-3.5',{onsubmit:salvar},
      h('div','grid sm:grid-cols-2 gap-3.5',
        campo('Descrição', fDesc), campo('Origem', fOrig),
        campo('Tipo', fTipo), campo('Dia do recebimento', fDia, 'Opcional — só para exibir a data.'),
        campo('Valor recebido (R$)', fValor), campo('Valor da nota (R$)', fNota, 'Base do imposto. Em branco = tudo faturado.'),
        campo('Incide imposto?', fTrib), h('div'),
        campo('Mês de início', fIni), campo('Mês de fim', fFim, 'Em branco = continua todo mês.')),
      err,
      h('div','flex gap-2 justify-end pt-1',
        h('button','btn',{type:'button',onclick:closeModal},'Cancelar'),
        h('button','btn btn-primary',{type:'submit'}, novo?'Registrar receita':'Salvar'))));
}

function viewReceitas(){
  const m = month, P = state.params;
  const totalM = sum(state.receitas, r=>valorMesRec(r,m));
  const totalProx = sum(state.receitas, r=>valorMesRec(r,m+1));
  const impM = sum(state.receitas, r=>impostoGerado(r,m));
  const nAtivas = state.receitas.filter(r=>active(recSpan(r),m)).length;
  const passado = m<=nowMonth();
  const delta = totalProx - totalM;
  const kpi = (icone,label,valor,sub,cor) => h('div','glass rounded-2xl p-4 min-w-0',
    h('div','flex items-center gap-1.5 text-[0.75rem] text-dim font-medium', ic(icone,'w-3.5 h-3.5'), label),
    h('div',`num text-[1.5rem] font-semibold mt-1.5 truncate ${cor||''}`, valor),
    h('div','text-[0.72rem] text-dim mt-0.5 truncate', sub));

  const cabKpis = h('div','grid grid-cols-1 sm:grid-cols-3 gap-4 shrink-0',
    kpi('arrow-down-left', passado?'Total recebido no mês':'Total previsto no mês', brl(totalM), `${nAtivas} lançamento(s) em ${fmtMes(m)}`, 'text-income'),
    kpi('calendar-clock','Previsão do próximo mês', brl(totalProx), delta===0 ? `igual a ${fmtMes(m)}` : `${delta>0?'+':'−'}${brl(Math.abs(delta))} vs ${fmtMes(m)}`),
    kpi('landmark', passado?'Impostos retidos no mês':'Impostos previstos no mês', brl(impM), `a pagar em ${fmtMes(m+P.lag)} (${pct(P.aliquota)} s/ nota)`, 'text-amber'));

  const colsGrid = 'grid-cols-[minmax(0,1.7fr)_6.4rem_4.4rem_7.4rem_8rem_4.4rem]';
  const itens = [...state.receitas].sort((a,b)=>(active(recSpan(b),m)?1:0)-(active(recSpan(a),m)?1:0));
  const linhas = itens.map(r=>{
    const st = recStatus(r,m), ativa = active(recSpan(r),m), tributa = r.tributavel!=='Não';
    return h('div',`rowh grid ${colsGrid} items-center gap-3 px-4 py-2.5 ${ativa?'':'opacity-60'}`,
      h('div','flex items-center gap-3 min-w-0',
        h('div','grid place-items-center w-8 h-8 rounded-lg bg-income/10 text-income shrink-0', ic('arrow-down-left','w-4 h-4')),
        h('div','min-w-0',
          h('div','text-[0.875rem] font-medium truncate', r.descricao||'(sem descrição)'),
          h('div','text-[0.72rem] text-dim truncate', [r.origem||'Origem não informada', r.tipo].join(' · ')))),
      h('span',`inline-flex justify-center rounded-full px-2 py-0.5 text-[0.7rem] font-semibold ring-1 whitespace-nowrap ${REC_PILL[st.k]}`, st.t),
      h('span','num text-[0.78rem] text-mut text-right', ativa ? (r.dia ? `${pad2(r.dia)}/${pad2(m%12+1)}` : fmtMesCurto(m)) : '—'),
      h('span','num text-[0.9rem] font-semibold text-right', brl(r.valor)),
      tributa
        ? h('div','text-right', h('div','num text-[0.78rem] text-amber font-medium', ativa?brl(impostoGerado(r,m)):'—'), h('div','text-[0.66rem] text-dim', `Incide ${pct(P.aliquota)}`))
        : h('div','text-right text-[0.72rem] text-dim','Isenta de imposto'),
      h('div','flex justify-end gap-0.5',
        h('button','ibtn',{type:'button',title:'Editar','aria-label':'Editar receita',onclick:()=>modalReceita(r)}, ic('pencil','w-4 h-4')),
        h('button','ibtn hover:!text-coral',{type:'button',title:'Remover','aria-label':'Remover receita',onclick:()=>removeRow('receitas',r)}, ic('trash-2','w-4 h-4'))));
  });
  const cabLista = h('div',`grid ${colsGrid} items-center gap-3 px-4 py-2 border-b border-hair shrink-0`,
    ['Lançamento','Status','Data','Valor','Imposto',''].map((t,i)=>h('div',`eyebrow ${i>=2&&i<=4?'text-right':''} ${i===1?'text-center':''}`,t)));
  const lista = h('section','glass rounded-2xl flex flex-col min-h-[9rem] shrink overflow-hidden',
    h('div','flex items-center justify-between gap-3 px-4 pt-4 pb-3 shrink-0',
      h('div','flex items-center gap-2 text-[0.8125rem] font-semibold text-mut', ic('list','w-4 h-4 text-dim'), 'Lançamentos de receita', h('span','num text-xs text-dim font-normal',`${state.receitas.length}`)),
      h('button','btn btn-primary !h-8 !text-[0.78rem]',{type:'button',onclick:()=>modalReceita(null)}, ic('plus','w-3.5 h-3.5'),'Nova receita')),
    cabLista,
    linhas.length
      ? h('div','flex-1 min-h-0 overflow-y-auto scroll-thin divide-y divide-hair', linhas)
      : h('div','flex-1 grid place-items-center text-center p-6',
          h('div','',h('div','text-sm font-medium','Nenhuma receita cadastrada'),h('div','text-xs text-dim mt-1','Registre salários, serviços e benefícios para calcular o orçamento.'),
            h('button','btn btn-primary mt-3',{type:'button',onclick:()=>modalReceita(null)}, ic('plus','w-4 h-4'),'Registrar receita'))));

  const acao = h('section','glass rounded-2xl p-3 shrink-0',
    h('button','btn btn-primary w-full !h-11',{type:'button',onclick:()=>modalReceita(null)}, ic('plus','w-4 h-4'),'Registrar nova receita'),
    h('p','text-[0.7rem] text-dim text-center mt-2','Painel, projeção e imposto se atualizam sozinhos.'));

  /* Previsão de receita: próximos 6 meses */
  const prev6 = Array.from({length:6},(_,i)=>({ m:m+i, v:sum(state.receitas,r=>valorMesRec(r,m+i)), imp:sum(state.receitas,r=>impostoGerado(r,m+i)) }));
  const maxPrev = Math.max(...prev6.map(x=>x.v), 1) * 1.05;
  const previsao = h('section','glass rounded-2xl p-4 flex flex-col flex-1 min-h-[11rem] overflow-hidden',
    cardTitle('bar-chart-3','Receita prevista · próximos 6 meses', h('span','num text-xs text-dim font-medium', brl(sum(prev6,x=>x.v)))),
    h('div','grid grid-cols-6 gap-3 flex-1 min-h-0', prev6.map((x,i)=>
      h('div','flex flex-col min-h-0 min-w-0 h-full',{title:`${fmtMesLongo(x.m)}: ${brl(x.v)} · imposto gerado ${brl(x.imp)}`},
        h('div','num text-[0.72rem] text-center font-semibold truncate', x.v>0 ? brl(x.v).replace('R$ ','') : '–'),
        h('div','relative flex-1 min-h-0 mt-1',
          h('div','absolute inset-x-[16%] bottom-0 rounded-t-md',{style:`height:${x.v/maxPrev*100}%;background:linear-gradient(180deg, rgb(var(--income)), rgb(var(--income) / .55))`})),
        h('div',`text-center text-[0.68rem] mt-1 font-medium ${i===0?'text-fg':'text-dim'}`, fmtMesCurto(x.m))))));

  /* Composição da receita do mês */
  const ativas = state.receitas.filter(r=>active(recSpan(r),m));
  const composicao = h('section','glass rounded-2xl p-4 flex flex-col flex-1 min-h-0 overflow-hidden',
    cardTitle('wallet','Composição da receita', h('span','num text-xs text-dim font-medium', fmtMes(m))),
    ativas.length
      ? h('div','flex-1 min-h-0 overflow-y-auto scroll-thin flex flex-col gap-3', ativas.map(r=>{
          const v = valorMesRec(r,m), share = totalM>0 ? v/totalM : 0, trib = r.tributavel!=='Não';
          return h('div','',
            h('div','flex items-baseline justify-between gap-2 text-[0.8125rem]', h('span','truncate font-medium', r.descricao||'(sem descrição)'), h('span','num text-mut shrink-0', brl(v))),
            h('div','mt-1 flex items-center gap-2',
              h('div','track flex-1 !h-1.5', h('div','fill',{style:`width:${share*100}%;background:${trib?'linear-gradient(90deg, rgb(var(--indigo) / .55), rgb(var(--indigo)))':'rgb(var(--dim))'}`})),
              h('span','num text-[0.7rem] text-mut w-11 text-right', pct(share))),
            h('div','text-[0.68rem] text-dim mt-0.5', trib ? `Tributável · base ${brl(baseImposto(r))}` : 'Isenta de imposto'));
        }))
      : h('div','flex-1 grid place-items-center text-sm text-dim','Sem receitas neste mês.'));

  return h('div','grid grid-cols-1 lg:grid-cols-[65fr_35fr] gap-4 fit-1row fade-in [&>*]:min-w-0',
    h('div','flex flex-col gap-4 min-h-0', cabKpis, lista, previsao),
    h('div','flex flex-col gap-4 min-h-0', taxCard(m), acao, composicao));
}

function setDis(tr, key, on){ const el = tr.querySelector(`[data-key="${key}"]`); if(el) el.disabled = on; }
/* Refaz a lista de subcategorias da linha quando a categoria muda */
function refazSub(tr, row){
  const col = SPEC.despesas.cols.find(c=>c.key==='sub'), el = tr && tr.querySelector('[data-key="sub"]');
  if(!el) return;
  el.replaceChildren(...col.options(row).map(o=>h('option',{value:o}, o===''?col.vazio:o)));
  el.value = row.sub || '';
}
function fillCalc(list, tbody){
  const spec = SPEC[list];
  tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
    const row = state[list].find(r=>r.id===tr.dataset.id); if(!row) return;
    spec.cols.filter(c=>c.type==='calc').forEach(c=>{
      const td = tr.querySelector(`[data-calc="${c.key}"]`);
      if(td){ td.textContent = c.calc(row); td.classList.toggle('text-amber', c.key==='c_ativa' && td.textContent!=='Sim'); td.classList.toggle('text-coral', c.key==='c_cabe' && td.textContent.startsWith('Não')); }
    });
    spec.rules(row, tr);
  });
}
function removeRow(list, row){
  const idx = state[list].indexOf(row);
  if(idx<0) return;
  state[list].splice(idx,1); save(); render();
  toast('Linha removida.', 'Desfazer', ()=>{ state[list].splice(idx,0,row); save(); render(); });
}
function viewTable(list){
  const spec = SPEC[list];
  const tbody = h('tbody','divide-y divide-hair');
  state[list].forEach(row=>{
    const tr = h('tr','rowh',{'data-id':row.id});
    spec.cols.forEach(col=>{
      if(col.type==='calc'){ tr.append(h('td',`num text-right text-mut px-3 py-2 whitespace-nowrap ${col.xl?'hidden min-[2000px]:table-cell':''}`,{'data-calc':col.key})); return; }

      }

        cb.addEventListener('change',()=>{ marcaPago(row.id, month, cb.checked); });
        tr.append(h('td','px-0 py-1.5 text-center w-10',cb)); return;
      }
      let input;
      if(col.type==='select'){
        input = h('select','fld',{'data-key':col.key,'aria-label':col.label}, col.options(row).map(o=>{
          const ov = typeof o==='object' ? o.v : o, ol = typeof o==='object' ? o.l : (o===''?(col.vazio||'— escolha —'):o);
          return h('option',{value:ov}, ol);

        input = h('input','fld',{type:'text','data-key':col.key,'aria-label':col.label,value:row[col.key]||''});
      }
      input.addEventListener('change',()=>{
        const old = row[col.key];
        row[col.key] = col.parse ? col.parse(input.value) : input.value;
        if(col.onchange) col.onchange(row, old, row[col.key], tr);
        save(); fillCalc(list, tbody);
        if(spec.depois) spec.depois();
      });
      tr.append(h('td',`px-2 py-1.5 ${col.w||''}`,input));

    tbody.append(tr);

  if(list==='despesas'){            // o imposto sobre nota também é uma conta a pagar no mês
    const imp = taxInfo(month).imposto;
    if(imp>0){
      const cb = h('input',{type:'checkbox','data-key':'pago','aria-label':'Marcar o imposto sobre nota como pago',class:'w-[1.1rem] h-[1.1rem] cursor-pointer accent-[rgb(var(--accent-primary))]',title:'Pago ✓'});

      tbody.append(h('tr','rowh bg-fg/[0.025]',
        h('td','px-0 py-2 text-center w-10',cb),
        h('td',{colspan:String(spec.cols.length-1)}, h('span','px-3 text-sm font-medium','Imposto sobre nota (calculado)'), h('span','text-xs text-dim',`  ·  ${fmtMes(month)}  ·  `), h('span','num text-sm text-amber font-semibold',brl(imp))),
        h('td','')));
    }
  }
  const thead = h('thead','',h('tr','text-left border-b border-hair', spec.cols.map(c=>h('th',`eyebrow font-semibold ${c.type==='pago'?'px-1 text-center':'px-3'}${c.type==='acao'?' !text-transparent':''} py-3 whitespace-nowrap ${c.type==='calc'?'text-right':''} ${c.xl?'hidden min-[2000px]:table-cell':''}`,c.label)), h('th','')));
  const body = state[list].length
    ? h('div','overflow-x-auto scroll-thin', h('table','w-full text-sm',thead,tbody))
    : h('div','py-14 text-center text-sm text-dim','Nada cadastrado ainda.');
  fillCalc(list, tbody);
  return h('div','space-y-4 fade-in',
    h('div','flex flex-wrap items-end justify-between gap-3',
      h('div','max-w-[70ch]',
        h('div','flex items-center gap-2 text-lg font-semibold tracking-tight', ic(spec.icon,'w-5 h-5 text-mut'), spec.titulo),
        h('p','text-sm text-mut mt-1',spec.ajuda),

      h('button','btn btn-primary',{type:'button',onclick:()=>{ state[list].push(spec.novo()); save(); render(); }}, ic('plus','w-4 h-4'), spec.add)),
    h('div','glass rounded-2xl overflow-hidden', body));
}

function pwField(label, ac){

  const eye = h('button','absolute right-1.5 top-1/2 -translate-y-1/2 ibtn',{type:'button','aria-label':'Mostrar ou ocultar',tabindex:'-1',onclick:()=>{

function forcaSenha(s){
  let n = 0; if(s.length>=8) n++; if(s.length>=12) n++; if(/[a-z]/.test(s)&&/[A-Z]/.test(s)) n++; if(/\d/.test(s)&&/[^A-Za-z0-9]/.test(s)) n++;
  return n;
}
function medidorSenha(input){
  const bar = h('div','flex gap-1 mt-2', [0,1,2,3].map(()=>h('i','h-1 flex-1 rounded-full bg-fg/10')));
  const txt = h('div','text-[0.7rem] text-dim mt-1','Use 8 ou mais caracteres. Frases longas são melhores que senhas curtas.');
  input.addEventListener('input',()=>{
    const n = input.value ? forcaSenha(input.value) : 0;
    [...bar.children].forEach((b,i)=>{ b.className = 'h-1 flex-1 rounded-full ' + (i<n ? (n<=1?'bg-coral':n<=2?'bg-amber':'bg-mint') : 'bg-fg/10'); });
    txt.textContent = !input.value ? 'Use 8 ou mais caracteres. Frases longas são melhores que senhas curtas.' : ['Muito fraca','Fraca','Razoável','Boa','Forte'][n];
  });
  return h('div','',bar,txt);
}
const slowGuard = async (btn, labelBusy, fn) => {
  const old = btn.textContent; btn.disabled = true; btn.textContent = labelBusy;
  await new Promise(r=>setTimeout(r,30));
  try{ return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
};

function showLock(mode, extra={}){
  const el = $('#lock');
  el.classList.remove('hidden'); el.classList.add('flex');
  $('#app').setAttribute('inert','');
  const err = h('p','text-sm text-coral min-h-[1.25rem] mt-3 text-center',{role:'alert'});
  const setErr = m => { err.textContent = m||''; };
  let card;

  if(mode==='setup'){
    const p1 = pwField('Crie uma senha','new-password'), p2 = pwField('Repita a senha','new-password');
    const btn = h('button','btn btn-primary w-full !h-11 mt-4',{type:'submit'},'Criar senha e continuar');
    const legacy = (()=>{ try{ const s = JSON.parse(lsGet(K_LEGACY)); return valid(s)?s:null; }catch(e){ return null; } })();
    card = lockShell('shield-check','Proteja seus dados','Eles ficam criptografados neste computador. Só quem tem a senha consegue abrir.',
      h('form','space-y-3.5',{onsubmit:async e=>{
        e.preventDefault(); setErr('');
        const s = p1.input.value;
        if(s.length<8) return setErr('A senha precisa ter pelo menos 8 caracteres.');
        if(s!==p2.input.value) return setErr('As senhas não conferem.');
        try{
          const inicial = legacy || SEED(); migrar(inicial);
          const code = await slowGuard(btn,'Protegendo…',()=>criarConta(s, inicial));
          if(legacy) lsDel(K_LEGACY);
          showLock('codigo',{code});
        }catch(ex){ setErr('Não foi possível criar a proteção: '+ex.message); }
      }}, p1.el, medidorSenha(p1.input), p2.el, btn, err));
  }

  else if(mode==='codigo'){
    const salvo = h('input',{type:'checkbox',class:'mt-0.5 w-4 h-4 accent-[rgb(var(--accent-primary))]'});
    const go = h('button','btn btn-primary w-full !h-11 mt-4',{type:'button',disabled:true,onclick:()=>entrar()},'Continuar');
    salvo.addEventListener('change',()=>{ go.disabled = !salvo.checked; });
    card = lockShell('key-round','Guarde seu código de recuperação','Se esquecer a senha, este código é a única forma de abrir seus dados.',
      h('div','text-center num text-[1.15rem] font-semibold tracking-wider py-3.5 rounded-xl bg-fg/[0.05] border border-line select-all', extra.code),
      h('div','flex gap-2 mt-3',
        h('button','btn flex-1',{type:'button',onclick:async()=>{ try{ await navigator.clipboard.writeText(extra.code); toast('Código copiado.'); }catch(e){ toast('Não foi possível copiar. Anote à mão.'); } }}, ic('copy','w-4 h-4'),'Copiar'),
        h('button','btn flex-1',{type:'button',onclick:()=>{
          const blob = new Blob([`Código de recuperação — Orçamento\r\n\r\n${extra.code}\r\n\r\nGuarde em local seguro (fora deste computador). Sem a senha e sem este código, os dados não podem ser recuperados.\r\n`],{type:'text/plain'});
          const a = h('a',{href:URL.createObjectURL(blob),download:'codigo-de-recuperacao-orcamento.txt'}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        }}, ic('download','w-4 h-4'),'Salvar .txt')),
      h('label','flex items-start gap-2.5 text-sm text-mut mt-4 cursor-pointer', salvo, 'Guardei o código em um lugar seguro (fora deste computador).'),
      go);
  }

  else if(mode==='recover'){
    const code = h('input','fld !h-11 num uppercase tracking-wider',{type:'text',placeholder:'XXXXX-XXXXX-XXXXX-XXXXX',autocomplete:'off',spellcheck:'false'});
    const p1 = pwField('Nova senha','new-password'), p2 = pwField('Repita a nova senha','new-password');
    const btn = h('button','btn btn-primary w-full !h-11 mt-4',{type:'submit'},'Redefinir senha');
    card = lockShell('life-buoy','Recuperar acesso','Digite o código de recuperação que você guardou e escolha uma nova senha.',
      h('form','space-y-3.5',{onsubmit:async e=>{
        e.preventDefault(); setErr('');
        if(normRec(code.value).length<20) return setErr('Digite o código completo (20 caracteres).');
        if(p1.input.value.length<8) return setErr('A nova senha precisa ter pelo menos 8 caracteres.');
        if(p1.input.value!==p2.input.value) return setErr('As senhas não conferem.');
        try{
          const novo = await slowGuard(btn,'Verificando…',()=>recuperar(code.value, p1.input.value));
          limpaFalhas(); showLock('codigo',{code:novo});
        }catch(ex){ setErr('Código incorreto. Confira e tente de novo.'); }
      }},
        h('label','block', h('span','block text-xs text-mut mb-1.5 font-medium','Código de recuperação'), code),
        p1.el, p2.el, btn, err,
        h('button','block mx-auto text-sm text-mut hover:text-fg mt-1',{type:'button',onclick:()=>showLock('unlock')},'← Voltar')));
  }

  else { // unlock
    const p1 = pwField('Senha','current-password');
    const btn = h('button','btn btn-primary w-full !h-11 mt-4',{type:'submit'},'Entrar');
    let tick = null;
    const espera = () => {
      const ms = esperaRestante();
      if(ms>0){ btn.disabled = true; setErr(`Muitas tentativas. Aguarde ${Math.ceil(ms/1000)} s.`); if(!tick) tick = setInterval(espera,500); }
      else { if(tick){ clearInterval(tick); tick=null; } if(btn.textContent==='Entrar'){ btn.disabled=false; } if(/Aguarde/.test(err.textContent)) setErr(''); }
    };
    card = lockShell('lock-keyhole','Orçamento','Digite sua senha para abrir.',
      h('form','space-y-3.5',{onsubmit:async e=>{
        e.preventDefault(); setErr('');
        if(esperaRestante()>0) return espera();
        if(!p1.input.value) return setErr('Digite a senha.');
        try{
          await slowGuard(btn,'Abrindo…',()=>destrancar(p1.input.value));
          limpaFalhas(); entrar();
        }catch(ex){
          registraFalha(); p1.input.value=''; p1.input.focus();
          setErr('Senha incorreta.'); espera();
        }
      }}, p1.el, btn, err,
        h('button','block mx-auto text-sm text-mut hover:text-fg mt-1',{type:'button',onclick:()=>showLock('recover')},'Esqueci a senha')));
    setTimeout(espera,0);
    setTimeout(()=>p1.input.focus(),30);
  }

  el.replaceChildren(card);
  icons();
  const first = el.querySelector('input:not([type=checkbox])'); if(first && mode!=='unlock') first.focus();
}
function entrar(){
  animarEntrada = true;
  $('#lock').classList.add('hidden'); $('#lock').classList.remove('flex'); $('#lock').replaceChildren();
  $('#app').removeAttribute('inert');
  if(!qs.get('mes')) month = defaultMonth();
  armIdle(); render(); bkCarrega();
}

/* ═════════════ Backup automático rotativo (File System Access API) ═════════════
   Pasta escolhida pelo usuário → backup-auto-AAAA-MM-DD.json (um por dia, sobrescreve o do dia),
   no máximo 1 gravação a cada 5 min e só os 5 mais recentes são mantidos.
   O manipulador da pasta fica no IndexedDB (não contém dados financeiros). O arquivo NÃO é criptografado. */
const K_BKMETA = 'cf-backup-meta';
const BK_MIN_MS = 5*60*1000, BK_MANTER = 5, BK_RE = /^backup-auto-\d{4}-\d{2}-\d{2}\.json$/;
const bkSuportado = () => typeof window.showDirectoryPicker === 'function' && 'indexedDB' in window;
let bkDir = null, bkPerm = 'none', bkTimer = null, bkRodando = false;   // bkPerm: none | granted | prompt | erro
const bkMeta = () => { try{ return JSON.parse(lsGet(K_BKMETA)) || {}; }catch(e){ return {}; } };
const bkSetMeta = o => lsSet(K_BKMETA, JSON.stringify(Object.assign(bkMeta(), o)));
const idbAbre = () => new Promise((ok,err)=>{ const r = indexedDB.open('cf-handles',1); r.onupgradeneeded = ()=>r.result.createObjectStore('h'); r.onsuccess = ()=>ok(r.result); r.onerror = ()=>err(r.error); });
async function idbOp(modo, fn){ const db = await idbAbre(); try{ return await new Promise((ok,err)=>{ const q = fn(db.transaction('h',modo).objectStore('h')); q.onsuccess = ()=>ok(q.result); q.onerror = ()=>err(q.error); }); } finally{ db.close(); } }
const bkDataLocal = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function bkQuando(ms){
  if(!ms) return 'ainda não feito';
  const d = new Date(ms), hm = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return bkDataLocal(d)===bkDataLocal() ? `hoje às ${hm}` : `${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} às ${hm}`;
}
async function bkPermissao(pedir){
  if(!bkDir) return 'none';
  try{
    let p = await bkDir.queryPermission({mode:'readwrite'});
    if(p!=='granted' && pedir) p = await bkDir.requestPermission({mode:'readwrite'});
    return p==='granted' ? 'granted' : 'prompt';
  }catch(e){ return 'erro'; }
}
async function bkCarrega(){
  if(!bkSuportado() || bkDir) { bkAtualizaUI(); return; }
  try{ bkDir = (await idbOp('readonly', s=>s.get('backupDir'))) || null; }catch(e){ bkDir = null; }
  bkPerm = await bkPermissao(false);
  bkAtualizaUI();
}
async function bkVincular(){
  if(!bkSuportado()){ toast('Este navegador não permite escolher pasta de backup.'); return; }
  let dir;
  try{ dir = await window.showDirectoryPicker({ id:'orcamento-backup', mode:'readwrite' }); }
  catch(e){ if(e && e.name!=='AbortError') toast('Não foi possível vincular a pasta.'); return; }
  try{ await idbOp('readwrite', s=>s.put(dir,'backupDir')); }catch(e){ toast('Não foi possível guardar a pasta escolhida.'); return; }
  bkDir = dir; bkPerm = 'granted'; bkSetMeta({ nome: dir.name, erro: '' });
  await fazBackup(true);
}
async function bkReautorizar(){ bkPerm = await bkPermissao(true); if(bkPerm==='granted'){ bkSetMeta({erro:''}); await fazBackup(true); } else bkAtualizaUI(); }
async function bkDesvincular(){
  clearTimeout(bkTimer); bkTimer = null; bkDir = null; bkPerm = 'none';
  try{ await idbOp('readwrite', s=>s.delete('backupDir')); }catch(e){}
  bkSetMeta({ nome:'', erro:'' }); bkAtualizaUI(); toast('Pasta desvinculada. Os arquivos já gravados continuam lá.');
}
/* chamado a cada gravação: agrupa as alterações e respeita o intervalo mínimo de 5 min entre backups */
function agendaBackupAuto(){
  if(!bkDir || bkPerm!=='granted' || !state || bkTimer) return;
  const espera = Math.max(2000, (bkMeta().ultimo||0) + BK_MIN_MS - Date.now());
  bkTimer = setTimeout(()=>{ bkTimer = null; fazBackup(false); }, espera);
}
async function fazBackup(manual){
  if(!bkDir || !state || bkRodando) return false;
  bkRodando = true;
  try{
    if(await bkPermissao(false)!=='granted'){ bkPerm = 'prompt'; bkAtualizaUI(); return false; }
    const agora = Date.now(), nome = `backup-auto-${bkDataLocal()}.json`;
    const corpo = JSON.stringify(Object.assign({}, estadoParaArquivo(), { exportadoEm: new Date(agora).toISOString() }), null, 2);
    const fh = await bkDir.getFileHandle(nome, { create:true });
    const w = await fh.createWritable(); await w.write(corpo); await w.close();
    /* rotação: mantém só os BK_MANTER backups automáticos mais recentes (nomes AAAA-MM-DD ordenam por data) */
    const nomes = [];
    for await (const [n, hd] of bkDir.entries()) if(hd.kind==='file' && BK_RE.test(n)) nomes.push(n);
    nomes.sort().reverse();
    for(const n of nomes.slice(BK_MANTER)){ try{ await bkDir.removeEntry(n); }catch(e){} }
    bkPerm = 'granted'; bkSetMeta({ ultimo: agora, ultimoArq: nome, erro:'' });
    bkAtualizaUI(); if(manual) toast(`Backup gravado em “${bkDir.name}”.`);
    return true;
  }catch(e){
    bkSetMeta({ erro: String((e&&e.message)||e).slice(0,120) }); bkPerm = 'erro'; bkAtualizaUI();
    if(manual) toast('Não consegui gravar o backup na pasta. Veja Configurações › Backup.');
    return false;
  }finally{ bkRodando = false; }
}
function bkTextoStatus(){
  const m = bkMeta();
  if(!bkSuportado()) return { t:'Este navegador não permite backup automático em pasta.', warn:false };
  if(!bkDir) return { t:'Nenhuma pasta vinculada.', warn:false };
  if(bkPerm==='prompt') return { t:`Pasta “${m.nome||bkDir.name}”: precisa de autorização para continuar.`, warn:true };
  if(bkPerm==='erro') return { t:`Falha ao gravar na pasta “${m.nome||bkDir.name}”${m.erro?': '+m.erro:''}.`, warn:true };
  return { t:`Pasta “${m.nome||bkDir.name}” · último backup: ${bkQuando(m.ultimo)}`, warn:false };
}
function bkBloco(){
  const st = bkTextoStatus(), m = bkMeta();
  const bt = [];
  if(!bkSuportado()) { /* sem botões */ }
  else if(!bkDir) bt.push(h('button','btn',{type:'button',onclick:bkVincular}, ic('folder-sync','w-4 h-4'),'Vincular pasta de backup automático'));
  else{
    if(bkPerm!=='granted') bt.push(h('button','btn btn-primary',{type:'button',onclick:bkReautorizar}, ic('shield-check','w-4 h-4'),'Reautorizar pasta'));
    bt.push(h('button','btn',{type:'button',onclick:()=>fazBackup(true)}, ic('save','w-4 h-4'),'Fazer backup agora'));
    bt.push(h('button','btn',{type:'button',onclick:bkVincular}, ic('folder-sync','w-4 h-4'),'Trocar pasta'));
    bt.push(h('button','btn btn-danger',{type:'button',onclick:()=>{ if(confirm('Desvincular a pasta de backup automático?')) bkDesvincular(); }}, ic('unlink','w-4 h-4'),'Desvincular'));
  }
  return [
    h('div','text-sm font-medium', 'Backup automático em pasta'),
    h('p',`text-xs mt-1 ${st.warn?'text-amber':'text-dim'}`,{id:'bkStatus'}, st.t),
    bkDir ? h('p','text-xs text-dim mt-0.5', `Grava no máximo a cada 5 min · mantém os ${BK_MANTER} mais recentes (backup-auto-AAAA-MM-DD.json).`) : h('p','text-xs text-dim mt-0.5', 'Escolha uma pasta (de preferência no OneDrive ou em um pendrive). O arquivo gravado NÃO é criptografado.'),
    h('div','flex flex-wrap gap-2 mt-3', bt)
  ];
}
function bkAtualizaUI(){
  const ind = $('#bkInd'); if(!ind) return;
  const st = bkTextoStatus();
  if(!bkSuportado() || !bkDir || !state){ ind.style.display = 'none'; }
  else{
    ind.style.display = '';
    ind.classList.toggle('warn', st.warn);
    ind.replaceChildren(ic(st.warn?'shield-alert':'hard-drive','w-3.5 h-3.5'), h('span','hidden min-[1700px]:inline', st.warn ? 'Backup: autorizar' : 'Backup '+bkQuando(bkMeta().ultimo)));
    ind.title = st.t;
  }
  const box = document.getElementById('bkBox'); if(box) box.replaceChildren(...bkBloco());
  icons();
}
$('#bkInd').addEventListener('click',()=>{ if(tab!=='config'){ tab='config'; animarEntrada = true; render(); } else bkAtualizaUI(); });
