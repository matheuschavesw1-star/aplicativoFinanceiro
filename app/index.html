function viewConfig(){
  const P = state.params;
  const numField = (label, key, {factor=1, step='0.1', min=0}={}) => {
    const input = h('input','fld num',{type:'number',step,min,inputmode:'decimal',value:+(P[key]*factor).toFixed(4)});
    input.addEventListener('change',()=>{ const v=Number(input.value); P[key] = isFinite(v)?v/factor:P[key]; save(); });
    return field(label,input);
  };

  /* Imposto calculado: em qual categoria / subcategoria ele entra */
  const selCat = h('select','fld',{'aria-label':'Categoria do imposto'});
  const selSub = h('select','fld',{'aria-label':'Subcategoria do imposto'});
  const drawImposto = () => {
    selCat.replaceChildren(...catNomes().map(n=>h('option',{value:n},n)));
    if(!catNomes().includes(P.impostoCat)) P.impostoCat = catNomes()[0] || 'Outros';
    selCat.value = P.impostoCat;
    selSub.replaceChildren(h('option',{value:''},'— nenhuma —'), ...subsDe(P.impostoCat).map(s=>h('option',{value:s},s)));
    selSub.value = subsDe(P.impostoCat).includes(P.impostoSub) ? P.impostoSub : '';
  };
  selCat.addEventListener('change',()=>{ P.impostoCat = selCat.value; P.impostoSub = ''; save(); drawImposto(); });
  selSub.addEventListener('change',()=>{ P.impostoSub = selSub.value; save(); });

  /* Categorias principais e subcategorias */
  const catBox = h('div','grid gap-3 md:grid-cols-2');
  const drawCats = () => {
    catBox.replaceChildren(...state.categorias.map((c,i)=>{
      const nome = h('input','fld !font-semibold',{type:'text',value:c.nome,'aria-label':'Categoria '+(i+1)});
      nome.addEventListener('change',()=>{
        const novo = nome.value.trim(), old = c.nome;
        if(!novo || state.categorias.some((x,j)=>j!==i && x.nome===novo)){ nome.value = old; return; }
        state.despesas.forEach(d=>{ if(d.categoria===old) d.categoria = novo; });
        if(P.impostoCat===old) P.impostoCat = novo;
        c.nome = novo; save(); drawImposto();
      });
      const subsEl = h('div','flex flex-wrap gap-1.5 mt-2.5');
      const drawSubs = () => {
        subsEl.replaceChildren(...c.subs.map((s,j)=>{
          const inp = h('input','bg-transparent outline-none text-[0.8rem] px-2 h-7 min-w-0 flex-1',{type:'text',value:s,size:String(Math.max(6,s.length)),'aria-label':'Subcategoria '+s});
          inp.addEventListener('change',()=>{
            const novo = inp.value.trim(), old = c.subs[j];
            if(!novo || c.subs.some((x,k)=>k!==j && x===novo)){ inp.value = old; return; }
            state.despesas.forEach(d=>{ if(d.categoria===c.nome && d.sub===old) d.sub = novo; });
            if(P.impostoCat===c.nome && P.impostoSub===old) P.impostoSub = novo;
            c.subs[j] = novo; save(); drawImposto();
          });
          return h('div','flex items-center rounded-lg border border-line bg-s1 max-w-full min-w-0', inp,
            h('button','ibtn !w-6 !h-6 hover:!text-coral',{type:'button','aria-label':'Remover subcategoria '+s,title:'Remover',onclick:()=>{
              const rem = c.subs.splice(j,1)[0]; save(); drawSubs(); drawImposto();
              toast(`Subcategoria "${rem}" removida.`,'Desfazer',()=>{ c.subs.splice(j,0,rem); save(); drawSubs(); drawImposto(); });
            }}, ic('x','w-3 h-3')));
        }),
        h('button','btn !h-7 !text-[0.75rem] !px-2',{type:'button',onclick:()=>{ c.subs.push('Nova subcategoria'); save(); drawSubs(); drawImposto(); }}, ic('plus','w-3 h-3'),'subcategoria'));
        icons();
      };
      drawSubs();
      return h('div','rounded-xl border border-line bg-fg/[0.025] p-3',
        h('div','flex gap-2', nome,
          h('button','ibtn border border-line hover:!text-coral shrink-0',{type:'button','aria-label':'Remover categoria '+c.nome,title:'Remover categoria',onclick:()=>{
            const usa = state.despesas.filter(d=>d.categoria===c.nome).length;
            if(usa>0){ toast(`"${c.nome}" tem ${usa} despesa(s). Troque a categoria delas antes de remover.`); return; }
            const idx = state.categorias.indexOf(c); state.categorias.splice(idx,1); save(); drawCats();
            toast(`Categoria "${c.nome}" removida.`,'Desfazer',()=>{ state.categorias.splice(idx,0,c); save(); drawCats(); });
          }}, ic('trash-2','w-4 h-4'))),
        subsEl);
    }));
    icons(); drawImposto();
  };
  drawCats();

  const fileIn = h('input',{type:'file',accept:'application/json,.json',class:'hidden'});
  fileIn.addEventListener('change',async()=>{
    const f = fileIn.files[0]; if(!f) return;
    try{
      const s = JSON.parse(await f.text());
      if(!valid(s)) throw new Error('formato');
      migrar(s);
      state = s; save(); month = defaultMonth(); render(); toast('Backup importado.');
    }catch(e){ toast('Arquivo inválido: não é um backup deste app.'); }
    fileIn.value='';
  });

  const lockSel = h('select','fld',{'aria-label':'Bloqueio automático'}, [[0,'Nunca'],[5,'5 minutos'],[15,'15 minutos'],[30,'30 minutos'],[60,'1 hora']].map(([v,l])=>h('option',{value:String(v)},l)));
  lockSel.value = String(autoLockMin());

  const sec = (icone,titulo,...kids) => h('section','glass rounded-2xl p-5', cardTitle(icone,titulo), ...kids);
  return h('div','space-y-4 fade-in',
    h('div','flex items-center gap-2 text-lg font-semibold tracking-tight', ic('settings','w-5 h-5 text-mut'), 'Configurações'),
    h('div','grid gap-4 xl:grid-cols-2 min-[1700px]:grid-cols-3 items-start',
      h('div','grid gap-4 items-start',
        sec('sliders-horizontal','Parâmetros',
          h('div','grid sm:grid-cols-2 gap-4',
            numField('Alíquota do imposto sobre a nota (%)','aliquota',{factor:100}),
            numField('Imposto pago X meses após o recebimento','lag',{step:'1'}),
            numField('Limite de atenção (% comprometido)','limAtencao',{factor:100,step:'1'}),
            numField('Limite crítico (% comprometido)','limCritico',{factor:100,step:'1'}))),
        sec('landmark','Onde o imposto calculado aparece',
          h('p','text-sm text-mut mb-3','O imposto sobre nota entra no painel dentro desta categoria e subcategoria.'),
          h('div','grid sm:grid-cols-2 gap-4', field('Categoria', selCat), field('Subcategoria', selSub)))),
      sec('tags','Categorias e subcategorias', catBox,
        h('div','mt-3',h('button','btn',{type:'button',onclick:()=>{
          let n = 'Nova categoria', k = 2; while(state.categorias.some(c=>c.nome===n)) n = 'Nova categoria '+(k++);
          state.categorias.push({ nome:n, subs:[] }); save(); drawCats();
        }}, ic('plus','w-4 h-4'),'Adicionar categoria'))),
      h('div','grid gap-4 xl:col-span-2 xl:grid-cols-2 min-[1700px]:col-span-1 min-[1700px]:grid-cols-1 items-start',
        hostApp() ? sec('monitor','Janela do aplicativo', (()=>{
          const H = hostApp(), envia = o => { try{ window.chrome.webview.postMessage(JSON.stringify(o)); }catch(e){} };
          const selX = h('select','fld',{'aria-label':'Ao clicar no X'}, [['1','Minimizar para a bandeja (como o Discord)'],['0','Fechar o aplicativo']].map(([v,l])=>h('option',{value:v},l)));
          selX.value = H.fecharNaBandeja ? '1' : '0';
          selX.addEventListener('change',()=>{ H.fecharNaBandeja = selX.value==='1'; envia({ tipo:'config', fecharNaBandeja:H.fecharNaBandeja }); toast('Preferência salva.'); });
          return h('div','', field('Ao clicar no X da janela', selX, 'Na bandeja (perto do relógio) o app continua aberto, mas fica bloqueado: ao voltar, peça a senha. A IA local é desligada enquanto a janela está escondida.'),
            h('div','mt-4', h('button','btn btn-danger',{type:'button',onclick:()=>envia({ tipo:'sair' })}, ic('power','w-4 h-4'),'Sair do aplicativo (encerra a IA)')));
        })()) : null,
        sec('shield-check','Segurança',
          h('p','text-sm text-mut mb-3','Seus dados são criptografados neste computador e protegidos por senha.'),
          field('Bloquear automaticamente após inatividade', lockSel),
          h('div','flex flex-wrap gap-2 mt-4',
            h('button','btn',{type:'button',onclick:bloquear}, ic('lock','w-4 h-4'),'Bloquear agora'),
            h('button','btn',{type:'button',onclick:modalTrocarSenha}, ic('key-round','w-4 h-4'),'Alterar senha'),
            h('button','btn',{type:'button',onclick:modalNovoCodigo}, ic('life-buoy','w-4 h-4'),'Novo código de recuperação'))),
        sec('database','Backup e dados',
          h('p','text-sm text-mut mb-1','Os dados ficam só neste computador. Exporte um backup de vez em quando — e para levar para outro aparelho.'),

function exportJson(){
  const blob = new Blob([JSON.stringify(estadoParaArquivo(),null,2)],{type:'application/json'});
  const a = h('a',{href:URL.createObjectURL(blob),download:`controle-financeiro-${new Date().toISOString().slice(0,10)}.json`});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ═════════════ LISTA DE COMPRAS ═════════════
   Itens que você pretende comprar, com prioridade, valor, forma de pagamento e mês. A coluna "Cabe no mês?" compara o item com a
   sobra do mês (receita − comprometido) já descontando os itens de MAIOR prioridade. "Lançar" cria a despesa e marca como comprado. */
const PRIO = { 'Alta':0, 'Média':1, 'Baixa':2 };
const compraN = c => c.pagamento==='Parcelado' ? Math.max(1, Math.round(num(c.parcelas)) || 1) : 1;
const compraPorMes = c => round2(num(c.valor) / compraN(c));
const compraImpacto = (c, m) => { const s = mi(c.mes); if(s==null || c.status==='Comprado') return 0; return (m>=s && m<s+compraN(c)) ? compraPorMes(c) : 0; };
function compraCabe(c){
  if(c.status==='Comprado' || !(num(c.valor)>0) || mi(c.mes)==null) return null;
  const m = mi(c.mes), S = summary(m);
  const ordem = state.compras.filter(x=>x.status!=='Comprado').slice().sort((a,b)=>(PRIO[a.prioridade]??1)-(PRIO[b.prioridade]??1) || state.compras.indexOf(a)-state.compras.indexOf(b));
  const sobra = round2(S.saldo - sum(ordem.slice(0, ordem.indexOf(c)+1), x=>compraImpacto(x, m)));
  return { sobra, ok: sobra >= 0 };
}
function lancarCompra(c){
  if(c.status==='Comprado'){ toast('Este item já está como comprado.'); return; }
  if(!c.item || !(num(c.valor)>0) || mi(c.mes)==null){ toast('Preencha o item, o valor e o mês da compra antes de lançar.'); return; }
  const n = compraN(c);
  const d = { id:uid(), descricao:c.item, categoria: catNomes().includes('Outros') ? 'Outros' : (catNomes()[0]||'Outros'), sub:'', tipo: n>1?'Parcelada':'Única', valor: compraPorMes(c), inicio:c.mes, parcelas: n>1?n:null, fim:'' };
  state.despesas.push(d); c.status = 'Comprado'; c.despesaId = d.id; save(); render();
  toast(`"${c.item}" lançado em Despesas (categoria ${d.categoria}).`, 'Desfazer', ()=>{ state.despesas = state.despesas.filter(x=>x.id!==d.id); c.status = 'Pendente'; delete c.despesaId; save(); render(); });
}

/* ═════════════ EXTRATO BANCÁRIO ═════════════
   Importa CSV ou OFX baixado do internet banking, categoriza por palavras-chave (você corrige e o app aprende a regra) e compara
   o gasto real de cada categoria com o que está planejado nas Despesas. Os arquivos são lidos aqui mesmo; nada é enviado a lugar nenhum. */
const chaveDesc = d => normTxt(d).replace(/[0-9]+/g,' ').replace(/\b(compra|pagamento|pagto|pgto|pix|ted|doc|transferencia|transf|debito|credito|em|no|na|de|do|da|dos|das|enviada|recebida|enviado|recebido|cartao|elo|visa|master|mastercard|via|ref|para|a|e)\b/g,' ').split(/[^a-z]+/).filter(w=>w.length>2).slice(0,2).join(' ');
const REGRAS_CAT = [
  [/mercado(?! ?(livre|pago))|supermerc|atacad|assai|carrefour|padaria|acougue|hortifruti|ifood|restaurante|lanchonete|pizzaria|burger|cafeteria|sorvet|churrasc|rappi/, 'Alimentação'],
  [/uber|\b99\b|taxi|combust|posto |shell|ipiranga|estaciona|pedagio|sem parar|conectcar|bilhete|metro|cptm|onibus/, 'Transporte'],
  [/farmac|drogar|drogasil|raia|unimed|hospital|clinica|laborat|dentis|odonto|amil|sulamerica|plano de saude/, 'Saúde'],
  [/enel|cpfl|\blight\b|energia|sabesp|copasa|saneamento|comgas|\bgas\b|\bclaro\b|\bvivo\b|\btim\b|\boi\b|internet|aluguel|condominio|iptu/, 'Moradia'],
  [/fatura|cartao de credito|pagamento de fatura|pgto fatura/, 'Cartão de Crédito'],
  [/contabil|contador|simples nacional|\bdas\b|darf|inss|cnpj|nota fiscal/, 'Empresa / Profissional'],
  [/pensao/, 'Pensão / Família']
];
const CAT_ENTRADA = 'Entrada', CAT_IGNORAR = '(ignorar)';
function categoriaAuto(desc, valor){
  const E = state.extrato, k = chaveDesc(desc), ent = valor > 0;
  const reg = k && E.regras[(ent?'+':'-')+k];
  if(reg) return reg;
  if(ent) return CAT_ENTRADA;
  const t = normTxt(desc);
  for(const [re,cat] of REGRAS_CAT) if(re.test(t)) return catNomes().includes(cat) ? cat : 'Outros';
  return 'Outros';
}
const dataBR = d => d.split('-').reverse().join('/');
function parseData(s){
  s = String(s||'').trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)) || (m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return (+m[2]>=1 && +m[2]<=12 && +m[3]>=1 && +m[3]<=31) ? `${m[1]}-${m[2]}-${m[3]}` : null;
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ let y = +m[3]; if(y<100) y += 2000; return (+m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31) ? `${y}-${pad2(m[2])}-${pad2(m[1])}` : null; }
  return null;
}
function parseValorBR(s){
  let t = String(s==null?'':s).trim(); if(!t) return null;
  const neg = /[-−–(]/.test(t) || /\s(D|DB|DEB)\s*$/i.test(t);
  t = t.replace(/[^\d.,]/g,''); if(!/\d/.test(t)) return null;
  const vi = t.lastIndexOf(','), po = t.lastIndexOf('.');
  if(vi>=0 && po>=0) t = vi>po ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
  else if(vi>=0) t = t.replace(/\./g,'').replace(',','.');
  else if(po>=0 && ((t.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(t))) t = t.replace(/\./g,'');
  const v = parseFloat(t); if(!isFinite(v)) return null;
  return round2(neg ? -Math.abs(v) : Math.abs(v));
}
function parseCsvRows(text, delim){
  const rows = []; let row = [], cur = '', q = false;
  const fim = ()=>{ row.push(cur); cur = ''; if(row.some(x=>x.trim()!=='')) rows.push(row); row = []; };
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch==='"') q = true;
    else if(ch===delim){ row.push(cur); cur = ''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; fim(); }
    else cur += ch;
  }
  if(cur!=='' || row.length) fim();
  return rows;
}
function parseExtrato(text){
  if(/<STMTTRN>/i.test(text)){   // OFX
    const dec1 = s => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    const linhas = text.split(/<STMTTRN>/i).slice(1).map(b=>{
      const tag = n => { const m = b.match(new RegExp('<'+n+'>\\s*([^<\\r\\n]*)','i')); return m ? dec1(m[1].trim()) : ''; };
      return { d: parseData(tag('DTPOSTED')), desc: (tag('MEMO') || tag('NAME') || '').replace(/\s+/g,' '), valor: parseValorBR(tag('TRNAMT')) };
    }).filter(x=>x.d && x.valor!=null);
    return { formato:'OFX', linhas };
  }
  const amostra = text.split(/\r?\n/).filter(l=>l.trim()).slice(0,40);
  const conta = c => amostra.reduce((t,l)=>t+(l.split(c).length-1),0);
  const delim = [';','\t',','].map(c=>[c,conta(c)]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows = parseCsvRows(text, delim);
  const N = c => normTxt(c);
  let hi = -1;
  for(let i=0;i<Math.min(rows.length,40);i++){ const c = rows[i].map(N); if(c.some(x=>/^(data|date|dt)/.test(x)) && c.some(x=>/valor|amount|credito|debito|entrada|saida|quantia/.test(x))){ hi = i; break; } }
  let iD = -1, iV = -1, iC = -1, iB = -1, iT = [];
  if(hi>=0){
    const c = rows[hi].map(N);
    iD = c.findIndex(x=>/^(data|date|dt)/.test(x));
    iV = c.findIndex((x,i)=>/^(valor|amount|quantia)/.test(x) && i!==iD);
    iC = c.findIndex(x=>/credito|entrada/.test(x)); iB = c.findIndex(x=>/debito|saida/.test(x));
    iT = c.map((x,i)=>/descri|hist|lancamento|title|titulo|estabelec|memo|detalhe|nome|beneficiario/.test(x) && i!==iD && !/^(data|date|dt)/.test(x) && !/categoria|saldo/.test(x) ? i : -1).filter(i=>i>=0);
    if(iV<0 && iC<0 && iB<0) hi = -1;
  }
  const linhas = [];
  if(hi>=0){
    for(const r of rows.slice(hi+1)){
      const d = parseData(r[iD]); if(!d) continue;
      let v = iV>=0 ? parseValorBR(r[iV]) : null;
      if(v==null){ const cr = iC>=0 ? parseValorBR(r[iC]) : null, db = iB>=0 ? parseValorBR(r[iB]) : null; v = cr ? Math.abs(cr) : (db ? -Math.abs(db) : null); }
      if(v==null) continue;
      const desc = [...new Set(iT.map(i=>String(r[i]||'').replace(/\s+/g,' ').trim()).filter(Boolean))].join(' · ');
      linhas.push({ d, desc, valor:v });
    }
    return { formato:'CSV', linhas };
  }
  for(const r of rows){   // sem cabeçalho: acha a data, o valor e o maior texto
    const iDd = r.findIndex(x=>parseData(x)); if(iDd<0) continue;
    const iVv = r.findIndex((x,i)=>i!==iDd && /^[\s\-−(R$]*\d[\d.,]*\)?\s*[-DC]*$/i.test(String(x).trim()) && parseValorBR(x)!=null);
    if(iVv<0) continue;
    const desc = r.filter((x,i)=>i!==iDd && i!==iVv).sort((a,b)=>b.length-a.length)[0] || '';
    linhas.push({ d:parseData(r[iDd]), desc:desc.replace(/\s+/g,' ').trim(), valor:parseValorBR(r[iVv]) });
  }
  return { formato:'CSV', linhas, aviso: linhas.length ? 'O arquivo não tinha cabeçalho conhecido; confira as linhas de exemplo.' : '' };
}
async function lerTexto(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,''); }catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
const gastoDe = l => (l.cat && l.cat!==CAT_ENTRADA && l.cat!==CAT_IGNORAR) ? -l.valor : 0;
const entradaDe = l => l.cat===CAT_ENTRADA ? l.valor : 0;
const linhasDoMes = m => state.extrato.linhas.filter(l=>mi(l.d.slice(0,7))===m);
function importarLinhas(nome, brutas, inverter){
  const E = state.extrato, sinal = inverter ? -1 : 1;
  const chave = l => `${l.d}|${l.valor}|${normTxt(l.desc)}`;
  const ja = new Map(); for(const l of E.linhas) ja.set(chave(l), (ja.get(chave(l))||0)+1);
  const vistos = new Map(); let dup = 0; const novas = [];
  for(const b of brutas){
    const l = { d:b.d, desc:b.desc||'(sem descrição)', valor: round2(b.valor*sinal) };
    const k = chave(l), n = (vistos.get(k)||0)+1; vistos.set(k,n);
    if(n <= (ja.get(k)||0)){ dup++; continue; }
    novas.push({ id:uid(), d:l.d, desc:l.desc, valor:l.valor, cat:categoriaAuto(l.desc, l.valor) });
  }
  E.linhas.push(...novas); E.linhas.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  E.arquivos.push({ nome, em:new Date().toISOString().slice(0,10), n:novas.length });
  save();
  return { novas, dup };
}
function modalImportar(nome, res){
  const ls = res.linhas, pos = ls.filter(l=>l.valor>0).length, neg = ls.filter(l=>l.valor<0).length;
  const pareceFatura = ls.length>=5 && neg===0 && pos>0;
  const cb = h('input',{type:'checkbox',class:'mt-0.5 w-4 h-4 accent-[rgb(var(--accent-primary))]'}); cb.checked = pareceFatura;
  const info = h('div','text-sm text-mut'), amostra = h('div','mt-3 rounded-xl border border-hair divide-y divide-hair text-[0.8rem] max-h-44 overflow-auto scroll-thin');
  const desenha = ()=>{
    const s = cb.checked ? -1 : 1, ent = sum(ls.filter(l=>l.valor*s>0), l=>l.valor*s), sai = sum(ls.filter(l=>l.valor*s<0), l=>-l.valor*s);
    const ds = ls.map(l=>l.d).sort();
    info.replaceChildren(h('div','',`${ls.length} lançamentos · ${dataBR(ds[0])} a ${dataBR(ds[ds.length-1])} · formato ${res.formato}`),
      h('div','mt-1',`Entradas ${brl(ent)} · Saídas ${brl(sai)}`));
    amostra.replaceChildren(...ls.slice(0,6).map(l=>h('div','grid grid-cols-[4.5rem_minmax(0,1fr)_6.5rem] gap-2 px-3 py-1.5',
      h('span','num text-dim',dataBR(l.d).slice(0,5)), h('span','truncate',l.desc||'(sem descrição)'), h('span',`num text-right ${l.valor*s<0?'':'text-mint'}`,brl(l.valor*s)))));
  };
  cb.addEventListener('change',desenha); desenha();
  const m = openModal(['Importar extrato','max-w-xl'],
    h('div','text-sm font-medium truncate mb-2',nome), info, amostra,
    res.aviso ? h('p','text-xs text-amber mt-2',res.aviso) : null,
    h('label','flex gap-2 items-start text-sm mt-4 cursor-pointer', cb, h('span','',
      'Inverter os sinais ', h('span','text-dim text-xs block','Marque se os gastos aparecem como valores positivos (comum em fatura de cartão). Nas "Saídas" acima devem estar as compras.'))),
    h('div','flex justify-end gap-2 mt-5',
      h('button','btn',{type:'button',onclick:closeModal},'Cancelar'),
      h('button','btn btn-primary',{type:'button',onclick:()=>{
        const r = importarLinhas(nome, ls, cb.checked); closeModal();
        if(r.novas.length) month = mi(r.novas.map(l=>l.d).sort().pop().slice(0,7));
        render(); toast(`${r.novas.length} lançamento(s) importado(s)${r.dup?` · ${r.dup} já existia(m)`:''}.`);
      }}, ic('download','w-4 h-4'),'Importar')));
  return m;
}
function viewExtrato(){
  const E = state.extrato, ls = linhasDoMes(month);
  const fileIn = h('input',{type:'file',accept:'.csv,.ofx,.txt,text/csv',class:'hidden'});
  fileIn.addEventListener('change', async()=>{
    const f = fileIn.files[0]; if(!f) return;
    try{
      const res = parseExtrato(await lerTexto(f));
      if(!res.linhas.length) toast(`Não consegui ler "${f.name}". Exporte do internet banking em CSV ou OFX (PDF não é suportado).`);
      else modalImportar(f.name, res);
    }catch(e){ toast('Não consegui ler esse arquivo.'); }
    fileIn.value = '';
  });
  const ent = sum(ls, entradaDe), sai = sum(ls, gastoDe);
  const real = new Map(); for(const l of ls){ const g = gastoDe(l); if(g) real.set(l.cat, round2((real.get(l.cat)||0)+g)); }
  const plan = summary(month).porCat;
  const cats = [...new Set([...real.keys(), ...[...plan.entries()].filter(([,e])=>e.v>0).map(([k])=>k)])]
    .map(c=>({ c, real: real.get(c)||0, plan: (plan.get(c)||{v:0}).v })).sort((a,b)=>b.real-a.real || b.plan-a.plan);
  const maxV = Math.max(...cats.map(x=>Math.max(x.real,x.plan)), 1);
  const mesesComDados = [...new Set(E.linhas.map(l=>mi(l.d.slice(0,7))))].sort((a,b)=>b-a);
  const busca = h('input','fld !h-9 max-w-xs',{type:'search',placeholder:'Buscar na descrição…','aria-label':'Buscar lançamentos',value:buscaExtrato});
  const lista = h('div','divide-y divide-hair');
  const opcoes = [CAT_ENTRADA, ...catNomes(), CAT_IGNORAR];
  const desenhaLista = ()=>{
    const q = normTxt(buscaExtrato);
    const vis = ls.filter(l=>!q || normTxt(l.desc).includes(q)).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
    lista.replaceChildren(...(vis.length ? vis.slice(0,500).map(l=>{
      const sel = h('select','fld !h-8 !text-[0.78rem]',{'aria-label':'Categoria de '+l.desc}, [...new Set([...opcoes, l.cat])].map(o=>h('option',{value:o},o)));
      sel.value = l.cat;
      sel.addEventListener('change',()=>{
        const k = chaveDesc(l.desc), sg = l.valor>0 ? '+' : '-'; let n = 0;
        l.cat = sel.value;
        if(k){ E.regras[sg+k] = sel.value; for(const o of E.linhas) if(o!==l && (o.valor>0)===(l.valor>0) && chaveDesc(o.desc)===k && o.cat!==sel.value){ o.cat = sel.value; n++; } }
        save(); render(); if(n) toast(`${n} lançamento(s) parecido(s) também foram para "${sel.value}".`);
      });
      return h('div','rowh grid grid-cols-[4rem_minmax(0,1fr)_6.5rem_11rem_2rem] items-center gap-2 px-3 py-1',
        h('span','num text-[0.78rem] text-dim',dataBR(l.d).slice(0,5)), h('span','truncate text-[0.8125rem]',{title:l.desc},l.desc),
        h('span',`num text-right text-[0.8125rem] ${l.valor>0?'text-mint':''}`,brl(l.valor)), sel,
        h('button','ibtn hover:!text-coral',{type:'button',title:'Remover lançamento','aria-label':'Remover lançamento',onclick:()=>{ E.linhas = E.linhas.filter(x=>x!==l); save(); render(); }}, ic('x','w-3.5 h-3.5')));
    }) : [h('div','py-10 text-center text-sm text-dim', ls.length ? 'Nada encontrado para essa busca.' : 'Sem lançamentos neste mês.')]));
  };
  busca.addEventListener('input',()=>{ buscaExtrato = busca.value; desenhaLista(); });
  desenhaLista();
  const kpis = h('section','glass rounded-2xl grid grid-cols-2 lg:grid-cols-4 divide-x divide-hair overflow-hidden',
    kpiCell('arrow-down-left','Entradas', brl(ent), `${ls.filter(l=>l.cat===CAT_ENTRADA).length} lançamento(s)`),
    kpiCell('arrow-up-right','Saídas', brl(sai), 'categorias somadas'),
    kpiCell('scale','Resultado do mês', brl(round2(ent-sai)), 'entradas − saídas'),
    kpiCell('receipt-text','Lançamentos', String(ls.length), `${E.linhas.length} no total`));
  const comp = h('section','glass rounded-2xl p-4',
    cardTitle('bar-chart-3','Onde foi o dinheiro · planejado × real', h('span','text-xs text-dim font-medium',fmtMes(month))),
    cats.length ? h('div','grid gap-1.5', [h('div','grid grid-cols-[minmax(0,1.3fr)_minmax(0,2fr)_6.2rem_6.2rem_6.2rem] gap-3 px-1.5 eyebrow !text-[0.62rem]', h('span','','Categoria'), h('span','',''), h('span','text-right','Planejado'), h('span','text-right','Real'), h('span','text-right','Diferença'))].concat(cats.map(x=>{
      const dif = round2(x.real - x.plan);
      return h('div','rowh grid grid-cols-[minmax(0,1.3fr)_minmax(0,2fr)_6.2rem_6.2rem_6.2rem] items-center gap-3 px-1.5',{title:`${x.c}: planejado ${brl(x.plan)} · real ${brl(x.real)}`},
        h('span','truncate text-[0.8125rem]',x.c),
        h('div','relative h-3', h('div','absolute inset-y-0 left-0 rounded-full',{style:`width:${x.plan/maxV*100}%;background:rgb(var(--fg) / .12)`}),
          h('div','absolute left-0 rounded-full',{style:`top:2px;bottom:2px;width:${x.real/maxV*100}%;background:linear-gradient(90deg, rgb(var(--indigo) / .6), rgb(var(--indigo)))`})),
        h('span','num text-[0.78rem] text-dim text-right',brl(x.plan)), h('span','num text-[0.8125rem] font-medium text-right',brl(x.real)),
        h('span',`num text-[0.78rem] text-right ${dif>0.005?'text-coral':dif<-0.005?'text-mint':'text-dim'}`, dif>0.005?'+'+brl(dif):brl(dif)));
    })))
      : h('p','text-sm text-dim','Importe um extrato para comparar o que foi planejado com o que foi gasto de verdade.'),
    h('p','text-[0.7rem] text-dim mt-3','"Planejado" vem das Despesas do mês (inclui parcelas e imposto). "Real" soma as saídas do extrato por categoria. Dica: se importar também a fatura do cartão, marque o pagamento da fatura como (ignorar) para não contar duas vezes.'));
  const cab = h('div','flex flex-wrap items-end justify-between gap-3',
    h('div','max-w-[70ch]',
      h('div','flex items-center gap-2 text-lg font-semibold tracking-tight', ic('receipt-text','w-5 h-5 text-mut'),'Extrato bancário'),
      h('p','text-sm text-mut mt-1','Baixe o extrato (CSV ou OFX) no internet banking e importe aqui. O arquivo é lido neste computador e fica criptografado junto com seus dados.')),
    h('div','flex flex-wrap gap-2',
      h('button','btn btn-primary',{type:'button',onclick:()=>fileIn.click()}, ic('upload','w-4 h-4'),'Importar extrato'), fileIn,
      E.linhas.length ? h('button','btn btn-danger',{type:'button',onclick:()=>{
        if(!confirm(`Apagar TODOS os ${E.linhas.length} lançamentos importados? Não afeta suas despesas e receitas.`)) return;
        const bk = JSON.stringify(E); E.linhas = []; E.arquivos = []; E.regras = {}; save(); render();
        toast('Extrato apagado.','Desfazer',()=>{ Object.assign(state.extrato, JSON.parse(bk)); save(); render(); });
      }}, ic('trash-2','w-4 h-4'),'Apagar extrato') : null));
  const aviso = !ls.length && mesesComDados.length ? h('div','glass rounded-2xl p-4 flex flex-wrap items-center gap-2 text-sm text-mut','Sem lançamentos em '+fmtMes(month)+'. Meses com extrato:',
    ...mesesComDados.slice(0,8).map(m=>h('button','btn !h-7 !px-2.5 !text-[0.78rem]',{type:'button',onclick:()=>setMonth(m)},fmtMesCurto(m)))) : null;
  return h('div','space-y-4 fade-in', cab, aviso, E.linhas.length ? kpis : null, E.linhas.length ? comp : null,
    h('section','glass rounded-2xl overflow-hidden',
      h('div','flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-b border-hair', h('div','text-[0.8125rem] font-semibold text-mut flex items-center gap-2', ic('list','w-4 h-4 text-dim'),'Lançamentos de '+fmtMes(month)), busca),
      E.linhas.length ? h('div','overflow-x-auto scroll-thin', h('div','min-w-[40rem]', lista)) : h('div','py-14 text-center text-sm text-dim','Nenhum extrato importado ainda. Use "Importar extrato".')));
}
let buscaExtrato = '';

/* ═════════════ Janela do aplicativo ═════════════
   (A versão com Assistente de IA está na pasta v2-com-ia do repositório.) */
const hostApp = () => window.__host || null;   // presente so no aplicativo instalado (Orcamento.exe); null no navegador

/* ═════════════ Navegação, tema e render ═════════════ */
let animarEntrada = true;   // a animação de entrada só roda ao trocar de aba (não a cada atualização da tela)
function render(){
  if(!state) return;
  afterRender.length = 0;
  const nav = []; let grupoAnt = null;
  for(const [k,l,i,g] of TABS){
    if(g!==grupoAnt){ nav.push(h('div','navgrp',g)); grupoAnt = g; }
    nav.push(h('button','tab',{type:'button',role:'tab','aria-selected':String(k===tab),title:l,onclick:()=>{ if(tab!==k){ tab=k; animarEntrada = true; render(); $('#view').scrollTo({top:0}); } }}, ic(i,'w-4 h-4'), h('span','lbl',l)));
  }
  $('#tabs').replaceChildren(...nav);
  const tinfo = TABS.find(t=>t[0]===tab) || TABS[0];
  $('#pageTitle').textContent = tinfo[1];
  $('#pageSub').textContent = tinfo[4] ? fmtMesLongo(month).replace(/^./,c=>c.toUpperCase()) : '';
  document.title = tinfo[1] + ' · Orçamento comprometido';
  $('#mesLabel').textContent = fmtMesLongo(month);
  $('#mes').value = miStr(month);
  const escBox = $('#escopoSel');
  escBox.style.display = tab==='painel' ? '' : 'none';
  if(tab==='painel') escBox.replaceChildren(...ESCOPOS.map(([k,l])=>
    h('button','esc',{type:'button',role:'radio','aria-checked':String(k===escopo),title:k==='tudo'?'Tudo: todas as receitas e despesas':k==='pessoal'?'Pessoal: sem a categoria Empresa / Profissional e sem o imposto':'Empresa: só Empresa / Profissional, com a receita medida pelo valor das notas',
      onclick:()=>{ if(escopo!==k){ escopo = k; lsSet('cf-escopo',k); render(); } }}, l)));
  bkAtualizaUI();
  $('#view').replaceChildren(tab==='painel'?viewPainel(): tab==='projecao'?viewProjecao(): tab==='receitas'?viewReceitas(): tab==='config'?viewConfig()
    : tab==='compras'?viewCompras(): tab==='reserva'?viewReserva(): tab==='extrato'?viewExtrato(): viewTable(tab));
  if(!animarEntrada){ const raiz = $('#view').firstElementChild; if(raiz) raiz.classList.remove('fade-in'); }
  animarEntrada = false;
  icons();
  afterRender.forEach(fn=>fn());
}
function setMonth(m){ month = m; render(); }
$('#prev').addEventListener('click',()=>setMonth(month-1));
$('#next').addEventListener('click',()=>setMonth(month+1));
$('#hoje').addEventListener('click',()=>setMonth(nowMonth()));
$('#bloquear').addEventListener('click',bloquear);
const mesInput = $('#mes');
mesInput.addEventListener('change',e=>{ const m = mi(e.target.value); if(m!=null) setMonth(m); else e.target.value = miStr(month); });
mesInput.addEventListener('click',()=>{ try{ if(mesInput.showPicker) mesInput.showPicker(); }catch(e){} });
if(mesInput.type!=='month'){ mesInput.classList.remove('opacity-0'); mesInput.classList.add('text-center','bg-transparent'); }
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

const appEl = $('#app'), sideBtn = $('#sideToggle'), sidePref = lsGet('cf-side');
appEl.classList.toggle('side-min', sidePref ? sidePref==='0' : innerWidth < 2000);   // menu lateral: recolhido por padrão em janelas menores; a escolha fica salva
sideBtn.addEventListener('click',()=>{ const min = appEl.classList.toggle('side-min'); lsSet('cf-side', min?'0':'1'); });
const temaBtn = $('#tema');
const qs = new URLSearchParams(location.search);     // ?tema=dark&mes=2027-03&aba=projecao (só para pré-visualizar)
if(mi(qs.get('mes'))!=null) month = mi(qs.get('mes'));
if(TABS.some(t=>t[0]===qs.get('aba'))) tab = qs.get('aba');

/* ═════════════ Seletor de temas ═════════════ */
const TEMAS = [
  { k:'vidro',        n:'Vidro Claro',  d:'Painéis de vidro sobre um degradê luminoso', cores:['#E6EDFF','#FFFFFF','#007AFF'], meta:'#E6EDFF' },
  { k:'vidro-escuro', n:'Vidro Escuro', d:'Vidro fumê sobre um fundo noturno',          cores:['#0D0B22','#222640','#0A84FF'], meta:'#0D0B22' }
];
const temaValido = k => TEMAS.some(t=>t.k===k);
let tema = lsGet(K_THEME);
if(qs.get('tema') && temaValido(qs.get('tema'))) tema = qs.get('tema');
if(!temaValido(tema)) tema = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'vidro-escuro' : 'vidro';   // padrão: segue o sistema (ignora temas antigos)
let animaTemaTimer = null;
function aplicaTema(animar){
  const t = TEMAS.find(x=>x.k===tema) || TEMAS[0];
  const raiz = document.documentElement;
  if(animar){ raiz.classList.add('tema-anim'); clearTimeout(animaTemaTimer); animaTemaTimer = setTimeout(()=>raiz.classList.remove('tema-anim'), 420); }
  raiz.dataset.theme = t.k;
  $('#metaTema').setAttribute('content', t.meta);
  temaBtn.replaceChildren(ic('palette','w-4 h-4'));
  const txt = `Tema: ${t.n} (clique para trocar)`;
  temaBtn.title = txt; temaBtn.setAttribute('aria-label', txt); temaBtn.setAttribute('aria-haspopup','menu');
  icons();
}
let temaMenu = null;
function fechaMenuTema(){ if(temaMenu){ temaMenu.remove(); temaMenu = null; temaBtn.setAttribute('aria-expanded','false'); } }
function abreMenuTema(){
  fechaMenuTema();
  const r = temaBtn.getBoundingClientRect();
  temaMenu = h('div','glass rounded-xl p-1.5 fixed z-[95] w-[20.5rem] fade-in',{role:'menu','aria-label':'Escolher tema',style:`left:${Math.max(8,Math.round(Math.min(r.right+10, innerWidth - parseFloat(getComputedStyle(document.documentElement).fontSize)*20.5 - 8)))}px;bottom:${Math.max(8,Math.round(innerHeight-r.bottom))}px;max-height:calc(100vh - 16px);overflow:auto`},
    h('div','eyebrow px-2.5 pt-1.5 pb-1','Tema'),
    TEMAS.map(t=>h('button','w-full flex items-center gap-3 rounded-lg px-2.5 py-2 text-left rowh',{type:'button',role:'menuitemradio','aria-checked':String(t.k===tema),onclick:()=>{
        tema = t.k; lsSet(K_THEME, tema); aplicaTema(true); fechaMenuTema();
      }},
      h('span','flex shrink-0', t.cores.map((c,i)=>h('i','w-5 h-5 rounded-full border border-white/20 -ml-1.5 first:ml-0',{style:`background:${c}`}))),
      h('span','min-w-0 flex-1', h('span','block text-[0.8125rem] font-medium truncate',t.n), h('span','block text-[0.7rem] text-dim truncate',t.d)),
      t.k===tema ? ic('check','w-4 h-4 text-indigo shrink-0') : h('span','w-4 shrink-0'))));
  document.body.append(temaMenu); temaBtn.setAttribute('aria-expanded','true'); icons();
}
temaBtn.addEventListener('click', e=>{ e.stopPropagation(); temaMenu ? fechaMenuTema() : abreMenuTema(); });
document.addEventListener('click', e=>{ if(temaMenu && !temaMenu.contains(e.target)) fechaMenuTema(); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape') fechaMenuTema(); });
window.addEventListener('resize', fechaMenuTema);

/* PWA (só quando servido por http/https; o app do Windows roda direto do arquivo) */
let promptInstalar = null;
const instalarBtn = $('#instalar');
const showInstall = on => { instalarBtn.classList.toggle('hidden', !on); instalarBtn.classList.toggle('inline-flex', on); };
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar = e; showInstall(true); });
window.addEventListener('appinstalled', ()=>{ promptInstalar = null; showInstall(false); toast('App instalado.'); });
instalarBtn.addEventListener('click', async()=>{ if(!promptInstalar) return; promptInstalar.prompt(); try{ await promptInstalar.userChoice; }catch(e){} promptInstalar = null; showInstall(false); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ═════════════ Início ═════════════ */
aplicaTema();
icons();
if(!window.crypto || !crypto.subtle){
  $('#lock').classList.remove('hidden'); $('#lock').classList.add('flex');
  $('#lock').replaceChildren(h('div','max-w-sm text-center',h('h1','text-lg font-semibold mb-2','Navegador sem suporte'),h('p','text-sm text-mut','A proteção por senha precisa de um navegador atual (Edge ou Chrome), abrindo o app a partir de um arquivo local, de localhost ou de https.')));
} else {
  showLock(getAuth() ? 'unlock' : 'setup');
}
/* Selo "TESTE": aparece só quando a pasta do app tem "teste" no caminho (some sozinho ao ir para produção) */
try{ if(/teste/i.test(decodeURIComponent(location.pathname))){ $('#seloTeste').classList.remove('hidden'); document.title += ' (TESTE)'; } }catch(e){}
window.__app = { setMonth, summary, mi };
})();
</script>
</body>
</html>
